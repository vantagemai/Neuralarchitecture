id:'oferta',icon:'⚔️',name:'Oferta & Estratégia de Mercado',
desc:'Construir, refinar e posicionar ofertas com frameworks de elite',
prompts:[
{id:'o1',title:'Diagnóstico pela Equação de Valor',quando:'Quando a oferta não está convertendo ou o preço gera resistência',fonte:'$100M Offers — Alex Hormozi',
fields:[
{id:'oferta_desc',label:'Descreva sua oferta atual',ph:'Ex: consultoria de 6 semanas, 4 sessões, sistema de conversa comercial'},
{id:'ticket_atual',label:'Ticket atual e principal objeção de preço',ph:'Ex: R$6.000 — "está caro para mim agora"'},
{id:'resultado',label:'Resultado específico que promete',ph:'Ex: sistema de conversa comercial documentado e testado em 3 conversas reais'}
],
prompt:function(v,ctx){return 'FRAMEWORK: $100M Offers — Alex Hormozi (Value Equation: RD × PP / T × E)\n\n'+ctx+'\n\nOferta atual: '+v.oferta_desc+'\nTicket e objeção: '+v.ticket_atual+'\nResultado prometido: '+v.resultado+'\n\nDiagnostique a equação de valor:\n1. RD (Resultado dos Sonhos): o resultado está descrito na linguagem do cliente ou do operador?\n2. PP (Probabilidade Percebida): que prova existe? Case de perfil similar? O quanto o prospect acredita que vai funcionar PARA ELE?\n3. T (Tempo): qual é o prazo para o PRIMEIRO resultado concreto? (Não o final — o primeiro sinal)\n4. E (Esforço): qual é o esforço percebido pelo cliente? O que ele tem que mudar, aprender ou sacrificar?\n\nIdentifique o maior gap na equação e entregue:\n1. Diagnóstico do componente mais fraco\n2. 3 ajustes específicos para aumentar o valor percebido sem mudar o preço\n3. Versão reescrita da oferta com a equação otimizada';}
},
{id:'o2',title:'Carta de Vendas com Kennedy — P-A-S-T-O-R',quando:'Quando precisa criar copy de página de vendas ou apresentação completa',fonte:'Ultimate Sales Letter — Dan Kennedy',
fields:[
{id:'produto_k',label:'Produto ou serviço',ph:'Ex: sistema de conversa comercial para consultores'},
{id:'dor_k',label:'Dor mais aguda do ICP (em palavras dele)',ph:'Ex: "trava quando o cliente pergunta o preço e fecha abaixo do que queria cobrar"'},
{id:'prova_k',label:'Melhor prova que você tem (caso, resultado, depoimento)',ph:'Ex: Rafael, consultor B2B, fechou 2 clientes de R$5k em 3 semanas usando o sistema'}
],
prompt:function(v,ctx){return 'FRAMEWORK: The Ultimate Sales Letter — Dan Kennedy (P-A-S-T-O-R + 28 passos)\n\n'+ctx+'\n\nProduto: '+v.produto_k+'\nDor aguda: '+v.dor_k+'\nMelhor prova: '+v.prova_k+'\n\nConstrua a estrutura P-A-S-T-O-R completa:\nP — Problem: identifique e articule o problema com a intensidade correta\nA — Amplification: amplifique as consequências de não resolver\nS — Story/Solution: a história que conecta o problema à solução\nT — Transformation/Testimony: a transformação com prova específica\nO — Offer: a oferta completa com âncora, mecanismo e ticket\nR — Response: o CTA com urgência real\n\nEntregue:\n1. Estrutura P-A-S-T-O-R com cada seção desenvolvida\n2. Headline principal + 3 subheadlines\n3. Bullets de benefícios usando o "Segredo de Bencivenga" (benefício + razão específica)\n4. Chamada à ação com urgência real (não fabricada)';}
},
{id:'o3',title:'Oferta Irresistível em 3 Segundos',quando:'Quando a oferta não comunica valor imediato — o prospect não entende em 3 segundos',fonte:'The Irresistible Offer — Mark Joyner',
fields:[
{id:'oferta_joyner',label:'Sua oferta atual em 1 frase',ph:'Ex: consultoria de posicionamento de 6 semanas'},
{id:'roi_joyner',label:'Qual é o ROI claro para o cliente',ph:'Ex: fechamento de 2 clientes adicionais de R$5k = R$10k no primeiro mês'},
{id:'crenca_joyner',label:'Principal crença que impede a compra',ph:'Ex: "já tentei consultoria antes e não funcionou"'}
],
prompt:function(v,ctx){return 'FRAMEWORK: The Irresistible Offer — Mark Joyner (Touchstone: ROI + Believability + Promise)\n\n'+ctx+'\n\nOferta atual: '+v.oferta_joyner+'\nROI para o cliente: '+v.roi_joyner+'\nCrencia bloqueadora: '+v.crenca_joyner+'\n\nO Touchstone de Joyner tem 3 componentes obrigatórios que precisam estar em 1 frase:\n1. ROI: o retorno específico e mensurável\n2. Credibilidade: por que acreditar que vai funcionar\n3. Baixo Risco: o que reduz o medo de errar\n\nDiagnostique o Touchstone atual e entregue:\n1. Análise de por que a oferta atual não passa no teste dos 3 segundos\n2. Touchstone reescrito (1 frase com os 3 componentes)\n3. Proof elementos: 3 formas de aumentar a believability para a crença bloqueadora identificada\n4. Garantia ou redução de risco adequada para o nível de ceticismo do ICP';}
},
{id:'o4',title:'Canvas Blue Ocean do Território',quando:'Quando o mercado está saturado e você quer criar espaço próprio',fonte:'Blue Ocean Strategy — W. Chan Kim & Renée Mauborgne',
fields:[
{id:'concorrentes',label:'3 concorrentes principais (ou tipos de solução alternativa)',ph:'Ex: outros consultores de posicionamento, cursos online, agências'},
{id:'fatores',label:'Fatores em que o mercado compete hoje (o que todos oferecem)',ph:'Ex: número de sessões, frameworks, grupos de suporte, acesso ao mentor'},
{id:'diferencial',label:'O que você faz que nenhum concorrente faz',ph:'Ex: diagnóstico do ponto exato de quebra na conversa + script calibrado para o cliente específico'}
],
prompt:function(v,ctx){return 'FRAMEWORK: Blue Ocean Strategy — Kim & Mauborgne (ERRC Grid + Strategy Canvas)\n\nContexto do operador:\n'+ctx+'\n\nConcorrentes: '+v.concorrentes+'\nFatores de competição atuais: '+v.fatores+'\nDiferencial único: '+v.diferencial+'\n\nAplique o ERRC Grid:\n— ELIMINAR: quais fatores de competição podem ser eliminados sem perder o ICP?\n— REDUZIR: quais fatores podem ser reduzidos abaixo do padrão do setor?\n— AUMENTAR: quais fatores devem ser aumentados acima do padrão?\n— CRIAR: quais fatores nunca foram oferecidos no setor e devem ser criados?\n\nEntregue:\n1. ERRC Grid completo para o território do operador\n2. Identificação do "Oceano Azul" — o espaço não contestado\n3. Nova curva de valor que torna a concorrência irrelevante\n4. 1 frase de posicionamento Blue Ocean que não pode ser usada por nenhum concorrente';}
},
{id:'o5',title:'Design de Categoria — Play Bigger',quando:'Quando você quer criar e liderar uma nova categoria no lugar de competir',fonte:'Play Bigger — Al Ramadan, Dave Peterson, Christopher Lochhead, Kevin Maney',
fields:[
{id:'problema_cat',label:'O problema que sua categoria resolve (que ainda não tem nome)',ph:'Ex: operadores que têm valor mas não têm sistema — a "venda improvisada"'},
{id:'status_quo',label:'O inimigo — o comportamento ou crença que a categoria combate',ph:'Ex: a venda por impulso onde cada conversa é diferente e o resultado depende do humor'},
{id:'linguagem',label:'Palavras que você está começando a usar diferente dos outros',ph:'Ex: "sistema comercial" em vez de "estratégia de vendas", "ponto de quebra" em vez de "objeção"'}
],
prompt:function(v,ctx){return 'FRAMEWORK: Play Bigger — Ramadan, Peterson, Lochhead, Maney (Category Design + POV + Lightning Strike)\n\n'+ctx+'\n\nProblema da categoria: '+v.problema_cat+'\nInimigo/Status quo: '+v.status_quo+'\nLinguagem emergente: '+v.linguagem+'\n\nConstrua o Category Design:\n1. NOME DA CATEGORIA: o que você vai chamar esta nova forma de resolver o problema?\n2. O REI: por que você é o único rei natural desta categoria?\n3. POV (Point of View): o manifesto — "o mundo mudou e [problema], por isso existe [categoria], e [você] é quem lidera"\n4. O INIMIGO: o que sua categoria mata? (comportamento, crença ou solução antiga)\n5. LINGUAGEM SAGRADA: 5 termos que só você usa e que o ICP vai adotar\n6. LIGHTNING STRIKE: qual é o primeiro gesto público que declara você como rei da categoria?\n\nEntregue tudo acima + manifesto de 1 parágrafo que pode ser publicado.';}
},
{id:'o6',title:'Estratégia com The Crux — Rumelt',quando:'Quando você tem muitas prioridades e nenhuma virou resultado',fonte:'The Crux — Richard Rumelt',
fields:[
{id:'situacao',label:'Situação atual do negócio (receita, clientes, maior desafio)',ph:'Ex: 8 clientes ativos, R$4k ticket médio, quero chegar a R$20k/mês, não sei o que priorizar'},
{id:'obstaculos',label:'3 principais obstáculos que estão impedindo o crescimento',ph:'Ex: leads insuficientes, conversão baixa, oferta não está clara'},
{id:'recursos',label:'Seus recursos reais agora (tempo, energia, dinheiro, audiência)',ph:'Ex: 15h/semana, audiência de 2k seguidores, R$2k/mês para investir'}
],
prompt:function(v,ctx){return 'FRAMEWORK: The Crux — Richard Rumelt (Good Strategy / Bad Strategy + Diagnosis + Guiding Policy)\n\n'+ctx+'\n\nSituação: '+v.situacao+'\nObstáculos: '+v.obstaculos+'\nRecursos reais: '+v.recursos+'\n\nAplique o framework de Rumelt:\n\nDIAGNÓSTICO (o crux — o desafio central real):\n— Qual é o obstáculo fundamental que, se resolvido, desbloquearia todos os outros?\n— O que é sintoma e o que é causa raiz?\n— O crux não é uma lista de problemas — é a identificação do nó central\n\nGUIDING POLICY (a política orientadora):\n— A abordagem que vai endereçar o crux (não uma lista de táticas)\n— O que você VAI fazer e o que você DEFINITIVAMENTE NÃO VAI fazer\n\nACTIONS (ações coerentes):\n— 3 ações específicas que derivam da política e atacam o crux\n— Cada ação com critério de sucesso verificável em 30 dias\n\nBad Strategy Check:\n— Verifique se a estratégia atual é "bad strategy" (goals mascarados de estratégia, fluff, objetivos sem diagnóstico)';}
},
{id:'o7',title:'8 Desejos Vitais — Cashvertising',quando:'Quando precisa criar anúncio, copy de post ou script que ativa desejo imediato',fonte:'Cashvertising — Drew Eric Whitman',
fields:[
{id:'produto_cash',label:'O que você está promovendo',ph:'Ex: sistema de conversa comercial para consultores'},
{id:'dor_cash',label:'Dor principal do ICP (em palavras dele)',ph:'Ex: fecha abaixo do que queria cobrar e sente que entrega mais do que recebe'},
{id:'canal_cash',label:'Canal onde vai ser usado',ph:'Ex: anúncio no Instagram, script de reel, copy de landing page'}
],
prompt:function(v,ctx){return 'FRAMEWORK: CA$HVERTISING — Drew Eric Whitman (Life-Force 8 + 9 Secondary Desires + Ad Agency Secrets)\n\n'+ctx+'\n\nProduto: '+v.produto_cash+'\nDor do ICP: '+v.dor_cash+'\nCanal: '+v.canal_cash+'\n\nOS 8 DESEJOS VITAIS (Life-Force 8) — biologicamente programados, irresistíveis:\n1. Sobrevivência, saúde, vida mais longa\n2. Prazer nos alimentos e bebidas\n3. Liberdade do medo, dor e perigo\n4. Companhia sexual\n5. Condições de vida confortáveis\n6. Superioridade, ganhar, ser igual ou melhor que os outros\n7. Cuidado e proteção dos entes queridos\n8. Aprovação social\n\nIdentifique:\n1. Qual LF8 é mais forte para este ICP com este produto?\n2. Quais 3 Secondary Desires complementam (autoestima, curiosidade, status, orgulho, etc)\n3. Escreva copy usando os desejos identificados:\n   — Headline que ativa o LF8 primário\n   — 3 bullets que ativam os Secondary Desires\n   — CTA que conecta ação ao desejo primário\n4. Versão alternativa usando "The 17 Foundational Principles of Consumer Behavior"';}
},
{id:'o8',title:'Atravessar o Abismo',quando:'Quando você tem early adopters mas não consegue chegar no mercado mainstream',fonte:'Crossing the Chasm — Geoffrey A. Moore',
fields:[
{id:'adotantes',label:'Quem são seus early adopters atuais (perfil específico)',ph:'Ex: consultores tech-forward, acima de 5 anos, ticket R$8k+, adoram frameworks'},
{id:'mainstream',label:'Quem você quer alcançar no mainstream',ph:'Ex: consultores tradicionais, 3-7 anos, ticket R$3-6k, céticos com novas metodologias'},
{id:'abismo',label:'O que está impedindo a travessia (o abismo)',ph:'Ex: falta de proof points com perfis mais tradicionais, linguagem muito técnica'}
],
prompt:function(v,ctx){return 'FRAMEWORK: Crossing the Chasm — Geoffrey A. Moore (Technology Adoption Lifecycle + Beachhead Strategy)\n\n'+ctx+'\n\nEarly adopters: '+v.adotantes+'\nMainstream alvo: '+v.mainstream+'\nO abismo: '+v.abismo+'\n\nEstrategia de travessia:\n1. BEACHHEAD: identifique o nicho mais específico do mainstream que tem dor aguda e pode ser conquistado primeiro\n2. WHOLE PRODUCT: o que o mainstream precisa além do seu produto core? (suporte, integração, garantia, prova)\n3. POSITIONING SHIFT: como a mensagem precisa mudar de early adopter para mainstream? (de visão para pragmatismo)\n4. PROOF POINTS: que tipo de evidência o mainstream precisa que o early adopter não precisava\n5. DISTRIBUTION: que canais chegam no mainstream que não chegavam nos early adopters\n\nEntregue: estratégia de 90 dias para atravessar o abismo com o beachhead identificado.';}
}
,{id:'o9',title:'Identidade de Marca — Primal Branding',quando:'Quando a marca parece inconsistente ou não gera pertencimento e tribo',fonte:'Primal Branding — Patrick Hanlon + Brand Seduction — Daryl Weber',
fields:[
{id:'crenca_brand',label:'O credo — o que você acredita que os outros não acreditam',ph:'Ex: operadores perdem venda por falta de sistema, não por falta de valor'},
{id:'criacao_brand',label:'A história de criação do método ou sistema',ph:'Ex: depois de perder um contrato de R$40k por não saber sequenciar a conversa…'},
{id:'inimigo_brand',label:'O inimigo simbólico — comportamento ou crença que sua marca combate',ph:'Ex: a venda por impulso onde cada conversa é diferente e o resultado depende do humor'}
],
prompt:function(v,ctx){return 'FRAMEWORK: Primal Branding — Patrick Hanlon (7 Pieces of Primal Code) + Brand Seduction — Daryl Weber (Arquétipos inconscientes)\n\n'+ctx+'\n\nCredo: '+v.crenca_brand+'\nCriação: '+v.criacao_brand+'\nInimigo: '+v.inimigo_brand+'\n\nOS 7 ELEMENTOS DO PRIMAL CODE:\n1. THE CREATION STORY: a história de origem que explica por que você existe\n2. THE CREED: a crença central em 1 frase que seus seguidores adotam como própria\n3. THE ICONS: símbolos visuais e verbais que representam a marca\n4. THE RITUALS: comportamentos que membros da tribo praticam (o que você repete, celebra, exige)\n5. THE PAGANS: quem a marca exclui — sem inimigo, não há tribo\n6. THE SACRED WORDS: vocabulário exclusivo que sinaliza pertencimento\n7. THE LEADER: como o líder encarna os valores (não os declara)\n\nDE BRAND SEDUCTION (Weber):\n- Identifique o arquétipo inconsciente da marca (dos 12 de Jung)\n- Como esse arquétipo se manifesta ou deveria se manifestar nos 7 elementos\n\nEntregue: os 7 elementos preenchidos para sua marca + o arquétipo primário + diagnóstico de inconsistências entre o que você diz e o que sua marca comunica inconscientemente';}
}
]
},
{
id:'icp',icon:'🧠',name:'ICP & Comportamento',
desc:'Mapear, entender e diagnosticar o cliente com profundidade real',
prompts:[
{id:'i1',title:'Entrevista JTBD Completa',quando:'Quando o ICP não está claro ou a oferta não está convertendo como esperado',fonte:'Demand-Side Sales 101 — Bob Moesta + JTBD Playbook — Jim Kalbach',
fields:[
{id:'cliente_jtbd',label:'Perfil do cliente que quer entender melhor',ph:'Ex: consultor de RH, 3 anos de mercado, carteira de 6 clientes, ticket em torno de R$3k'},
{id:'contexto_jtbd',label:'Contexto em que ele te contratou ou considerou contratar',ph:'Ex: após perder um cliente grande para concorrente mais barato, 2 meses atrás'}
],
prompt:function(v,ctx){return 'FRAMEWORK: Demand-Side Sales 101 (Moesta) + JTBD Playbook (Kalbach) + Mapping Experiences (Kalbach)\n\n'+ctx+'\n\nCliente alvo: '+v.cliente_jtbd+'\nContexto de contratação: '+v.contexto_jtbd+'\n\nConstrua um roteiro de entrevista JTBD completo:\n\nFASE 1 — TIMELINE (reconstruir o momento de compra):\n- "Me conta desde o início — o que estava acontecendo antes de você buscar uma solução?"\n- Perguntas para identificar: First Thought (quando a ideia surgiu), Passive Looking, Active Looking, Deciding, First Use\n\nFASE 2 — OS 4 FORÇAS:\n- Push (o que estava errado com a situação atual)\n- Pull (o que atraiu para a nova solução)\n- Anxiety (o que gerava medo de mudar)\n- Habit (o que dificultava largar o status quo)\n\nFASE 3 — JOB DIMENSIONS:\n- Funcional: o que precisava acontecer no mundo real\n- Emocional: como queria se sentir\n- Social: como queria ser percebido\n\nFASE 4 — PROGRESS MAKING:\n- Qual era o progresso que o cliente estava tentando fazer?\n- O que ele ia "demitir" para "contratar" a nova solução?\n\nEntregue: roteiro de 12-15 perguntas em sequência + interpretação do que cada resposta revela.';}
},
{id:'i2',title:'Teste de Posicionamento Obviously Awesome',quando:'Quando o cliente entende o que você faz mas não sente que é exatamente para ele',fonte:'Obviously Awesome — April Dunford',
fields:[
{id:'pos_atual',label:'Como você descreve o que faz hoje',ph:'Ex: consultoria de posicionamento para operadores de serviço premium'},
{id:'alternativas',label:'O que o cliente usaria se você não existisse',ph:'Ex: tentaria resolver sozinho, contrataria agência, compraria curso online'},
{id:'atributos',label:'O que você entrega que nenhuma alternativa entrega',ph:'Ex: diagnóstico do ponto exato de quebra + script calibrado para o perfil do cliente dele'}
],
prompt:function(v,ctx){return 'FRAMEWORK: Obviously Awesome — April Dunford (10-Step Positioning Process)\n\n'+ctx+'\n\nDescrição atual: '+v.pos_atual+'\nAlternativas competitivas: '+v.alternativas+'\nAtributos únicos: '+v.atributos+'\n\nAplique o processo de posicionamento de Dunford:\n1. BEST-FIT CUSTOMERS: quem são os clientes que mais amam o que você faz? (não o ICP ideal — quem já comprou e adorou)\n2. MARKET ALTERNATIVES: o que eles usariam se você não existisse? (esta é a referência de comparação real)\n3. UNIQUE ATTRIBUTES: o que você tem que nenhuma alternativa tem?\n4. VALUE: por que esses atributos importam para o cliente? (benefícios reais, não features)\n5. CHARACTERISTICS: quem são os clientes que mais se beneficiam desses valores?\n6. MARKET FRAME OF REFERENCE: em qual categoria você se encaixa — ou cria?\n\nEntregue: posicionamento testado pelo framework de Dunford + por que a descrição atual falha no teste + versão reescrita que passa.';}
},
{id:'i3',title:'Diagnóstico Buyology — Neuromarketing',quando:'Quando o racional está claro mas o ICP não age — algo irracional está bloqueando',fonte:'Buyology — Martin Lindstrom + Predictably Irrational — Dan Ariely',
fields:[
{id:'comportamento',label:'Comportamento do ICP que não faz sentido racional',ph:'Ex: concorda que precisa mas não compra / compra o mais barato e reclama do resultado'},
{id:'contexto_buy',label:'Contexto em que esse comportamento aparece',ph:'Ex: quando chega no momento de fechar, quando vê o preço antes do valor, quando compara com concorrentes'}
],
prompt:function(v,ctx){return 'FRAMEWORK: Buyology (Lindstrom) + Predictably Irrational (Ariely) + Blind Spot (Banaji)\n\n'+ctx+'\n\nComportamento irracional: '+v.comportamento+'\nContexto: '+v.contexto_buy+'\n\nDiagnostique os drivers subconscientes:\n\nDE BUYOLOGY (Lindstrom):\n- Quais somatic markers estão ativos? (associações emocionais automáticas)\n- Existe ritual ou superstição implícita na decisão de compra?\n- Qual é o "mirror neuron" ativo — o que o cliente vê em outros que o influencia?\n\nDE ARIELY (Irracionalidade Previsível):\n- Efeito de dotação: o cliente está supervalorizando o que já tem (a solução atual ruim)?\n- Ancoragem: existe um número de referência que distorce a percepção do preço?\n- Custo zero: o gratuito/barato está criando atratividade irracional?\n- Normas sociais vs. normas de mercado: a conversa está no modo errado?\n\nEntregue: diagnóstico dos 3 principais drivers irracionais + como ajustar a abordagem comercial para trabalhar COM eles, não contra eles.';}
},
{id:'i4',title:'Mapa de Progresso do Cliente',quando:'Quando a jornada de entrega não está clara ou o cliente sai sem o resultado prometido',fonte:'Mapping Experiences — Jim Kalbach + JTBD Playbook — Jim Kalbach',
fields:[
{id:'etapas',label:'Etapas da sua entrega hoje (como você estrutura o trabalho)',ph:'Ex: sessão 1 diagnóstico / sessão 2 script / sessão 3 feedback / sessão 4 calibração'},
{id:'resultado_esperado',label:'O resultado que o cliente deveria ter ao final',ph:'Ex: sistema de conversa documentado, testado em 3 conversas reais, com script calibrado'},
{id:'onde_falha',label:'Onde a jornada costuma falhar ou o cliente perde engajamento',ph:'Ex: entre a sessão 2 e 3 — implementação real não acontece'}
],
prompt:function(v,ctx){return 'FRAMEWORK: Mapping Experiences — Jim Kalbach (Experience Map + Jobs to Be Done)\n\n'+ctx+'\n\nEtapas da entrega: '+v.etapas+'\nResultado esperado: '+v.resultado_esperado+'\nOnde falha: '+v.onde_falha+'\n\nConstrua o Experience Map da jornada do cliente:\n\nPara cada etapa, mapeie:\n1. DOING: o que o cliente está fazendo?\n2. THINKING: o que está pensando?\n3. FEELING: o que está sentindo?\n4. PAIN POINTS: onde está o atrito?\n5. MOMENTS OF TRUTH: qual é o momento decisivo desta etapa?\n\nDiagnóstico:\n- Onde está o maior gap entre o que o cliente experimenta e o que você achou que estava entregando?\n- Qual momento de verdade não está sendo gerenciado?\n\nEntregue: mapa completo + 3 intervenções específicas para reduzir o atrito no ponto de maior falha.';}
},
{id:'i5',title:'Entrevista Mom Test Guiada',quando:'Quando precisa validar uma nova oferta ou descobrir a dor real antes de construir',fonte:'The Mom Test — Rob Fitzpatrick',
fields:[
{id:'hipotese',label:'Hipótese que quer validar (o que você acha que é verdade)',ph:'Ex: consultores perdem venda por objeção de preço por falta de sistema de conversa'},
{id:'perfil_int',label:'Perfil de quem você vai entrevistar',ph:'Ex: consultor com 3-5 anos de mercado, carteira de 5-10 clientes, ticket R$2k-5k'}
],
prompt:function(v,ctx){return 'FRAMEWORK: The Mom Test — Rob Fitzpatrick (Perguntas que revelam verdade sem validação social)\n\n'+ctx+'\n\nHipótese: '+v.hipotese+'\nPerfil do entrevistado: '+v.perfil_int+'\n\nRegras do Mom Test:\n1. Nunca pergunte sobre opiniões ou o futuro\n2. Pergunte sobre comportamento passado real\n3. Não mencione sua ideia/solução — deixe o problema emergir naturalmente\n\nConstrua o roteiro de entrevista (12 perguntas):\n\nPERGUNTAS DE CONTEXTO (comportamento, não opinião):\n- Sobre a vida/trabalho do entrevistado, não sobre sua solução\n\nPERGUNTAS SOBRE O PROBLEMA (sem revelar sua hipótese):\n- O que é difícil nesta área?\n- Me conta da última vez que isso aconteceu…\n- Como você resolve isso hoje?\n\nPERGUNTAS DE COMPROMETIMENTO (o que revela dor real):\n- Quanto tempo/dinheiro gasta com isso?\n- Já tentou resolver de outras formas?\n- O que aconteceria se continuasse como está?\n\nEntregue: 12 perguntas em sequência + como interpretar cada resposta + sinais de dor real vs. dor crônica.';}
},
{id:'i6',title:'Deploy Empathy — Entrevista Profunda',quando:'Quando precisa entender o mundo do cliente antes de refinar a mensagem',fonte:'Deploy Empathy — Michele Hansen',
fields:[
{id:'objetivo_emp',label:'O que você quer entender desta entrevista',ph:'Ex: por que ICP com dor óbvia não está comprando a oferta'},
{id:'cliente_emp',label:'Perfil de quem você vai entrevistar',ph:'Ex: consultor que demonstrou interesse mas não avançou, perfil OBSERVADOR'}
],
prompt:function(v,ctx){return 'FRAMEWORK: Deploy Empathy — Michele Hansen (Continuous Discovery + Empathy Interviews)\n\n'+ctx+'\n\nObjetivo: '+v.objetivo_emp+'\nPerfil: '+v.cliente_emp+'\n\nPrincípios Deploy Empathy:\n1. Silêncio estratégico — após cada resposta, espere 3-5 segundos antes de perguntar\n2. "Me conta mais sobre isso" — a frase mais poderosa da entrevista\n3. Nunca interrompa uma história — deixe fluir até o fim\n4. Busque o passado, não o futuro — "quando foi a última vez que…"\n\nConstrua a entrevista em 3 camadas:\n\nCAMADA 1 — CONTEXTO GERAL (aquecimento):\nPerguntas sobre o cotidiano sem pressão\n\nCAMADA 2 — O PROBLEMA ESPECÍFICO:\nPerguntas sobre o comportamento passado real relacionado ao objetivo\n\nCAMADA 3 — O MOMENTO DE DECISÃO:\nPerguntas sobre o que aconteceu na hora de agir (ou não agir)\n\nEntregue: 15 perguntas em sequência com anotações de quando usar silêncio e quando aprofundar + como sintetizar os insights em insights acionáveis.';}
}
,{id:'c9',title:'NEPQ — Perguntas de Neuro-Persuasão',quando:'Quando o script de vendas soa como roteiro e o prospect fecha antes de ouvir a oferta',fonte:'The New Model of Selling — Jeremy Miner & Jerry Acuff (NEPQ)',
fields:[
{id:'objecao_nepq',label:'A objeção mais comum que você enfrenta',ph:'Ex: "preciso pensar", "está caro", "não tenho tempo agora"'},
{id:'tipologia_nepq',label:'Tipologia do prospect que mais trava',ph:'Ex: Observador — analisa demais, pede para "pensar mais um pouco"'},
{id:'momento_nepq',label:'Em que momento da conversa a resistência aparece',ph:'Ex: quando apresento o preço / quando peço para marcar próximo passo / no início da triagem'}
],
prompt:function(v,ctx){return 'FRAMEWORK: The New Model of Selling — Jeremy Miner & Jerry Acuff (NEPQ: Neuro-Emotional Persuasion Questions)\n\n'+ctx+'\n\nObjeção mais comum: '+v.objecao_nepq+'\nTipologia que trava: '+v.tipologia_nepq+'\nMomento de resistência: '+v.momento_nepq+'\n\nO NEPQ parte da premissa: o cérebro compra por emoção e justifica por lógica. Perguntas que ativam o estado emocional correto convertem mais que argumentos.\n\n4 TIPOS DE PERGUNTAS NEPQ:\n1. SITUATIONAL: estabelecem contexto sem pressão ("Como está sendo lidar com X hoje?")\n2. PROBLEM AWARENESS: revelam consciência da dor ("Com que frequência isso acontece?")\n3. SOLUTION AWARENESS: exploram consequência ("O que acontece quando isso não é resolvido?")\n4. CONSEQUENCE: amplificam o custo de não agir ("Se isso continuar por mais 6 meses, o que muda?")\n\nEntregue:\n1. Sequência de 8 perguntas NEPQ para o processo de vendas (2 de cada tipo)\n2. Resposta NEPQ para a objeção fornecida (não rebater — aprofundar com pergunta)\n3. A pergunta de comprometimento final calibrada para a tipologia do prospect\n4. Como mudar o frame no momento específico onde a resistência aparece\n\nRegra NEPQ: nunca responda objeção com argumento — responda com pergunta que faz o prospect resolver a própria objeção.';}
}
]
},

{id:'c2',title:'Soap Opera Sequence — 5 Emails',quando:'Quando precisa criar sequência de nurture que converte sem parecer spam',fonte:'Soap Opera Sequence — Andre Chaperon',

{id:'virada_sos',label:'A revelação central — o que muda na visão de mundo do ICP',ph:'Ex: o problema não é o preço — é que o valor não foi estabelecido antes do número aparecer'}
],
prompt:function(v,ctx){return 'FRAMEWORK: Soap Opera Sequence — Andre Chaperon (Trust Equity + Soap Opera Structure)\n\n'+ctx+'\n\nProtagonista (ICP): '+v.protagonista_sos+'\nOferta ao final: '+v.produto_sos+'\nRevelação central: '+v.virada_sos+'\n\nConstrua os 5 emails da Soap Opera Sequence:\n\nEMAIL 1 — SET THE STAGE (Configuração):\nProtagonista em normalidade. Sem problema ainda — só contexto que o ICP reconhece.\nFIM: gancho que força abrir o próximo\n\nEMAIL 2 — HIGH DRAMA (Conflito):\nO problema em intensidade máxima. Nas palavras do ICP. Sem solução.\nFIM: "foi nesse momento que percebi algo que mudaria tudo…"\n\nEMAIL 3 — THE EPIPHANY (Revelação):\nA quebra de crença — a revelação que muda o frame. Baseada em: '+v.virada_sos+'\nFIM: "mas saber não era suficiente — precisava testar…"\n\nEMAIL 4 — HIDDEN BENEFITS (Prova):\nO que aconteceu quando aplicou. Caso de perfil similar ao protagonista.\nFIM: abertura para o leitor se identificar\n\nEMAIL 5 — THE OFFER (CTA):\nSó agora: a oferta. Com âncora, mecanismo e ticket.\n\nEntregue: os 5 emails completos + linha de assunto de cada um (curiosidade — nunca spam)';}
},
{id:'c3',title:'Escada de Valor — DotCom Secrets',quando:'Quando você quer estruturar produtos em sequência para maximizar LTV',fonte:'DotCom Secrets — Russell Brunson',
fields:[
{id:'produto_core',label:'Seu produto principal atual',ph:'Ex: sistema de conversa comercial — R$6k, 6 semanas'},
{id:'publico_dotcom',label:'Quem você atende hoje',ph:'Ex: consultores com carteira ativa, ticket R$3k-10k, 2-7 anos de mercado'},
{id:'resultado_final',label:'O resultado máximo que você poderia entregar',ph:'Ex: operação comercial completamente documentada e escalável com time'}
],
prompt:function(v,ctx){return 'FRAMEWORK: DotCom Secrets — Russell Brunson (Value Ladder + Dream Customer Journey)\n\n'+ctx+'\n\nProduto core: '+v.produto_core+'\nPúblico: '+v.publico_dotcom+'\nResultado máximo: '+v.resultado_final+'\n\nConstrua a Escada de Valor completa:\n\nDEGRAU 1 — ISCA (Bait):\nValor gratuito ou de baixíssimo custo que atrai o Dream Customer\nEx: diagnóstico, checklist, mini-treinamento\n\nDEGRAU 2 — PRODUTO FRONTEND:\nO produto de entrada — primeira transação real\nPreço: acessível, baixo risco\n\nDEGRAU 3 — PRODUTO CORE (seu atual):\nO produto principal — onde está a maior transformação\n\nDEGRAU 4 — PRODUTO BACKEND:\nO produto de maior valor — continuidade, intensivo, ou expansão\n\nDEGRAU 5 — MASTERMIND/PREMIUM:\nO topo — acesso máximo, resultado máximo\n\nPara cada degrau: nome, formato, ticket, resultado específico, como um degrau leva naturalmente ao próximo\n\nEntregue também: a sequência de apresentação de cada degrau (quando e como oferecer) + regra de ouro de Brunson: "quem pode gastar mais para adquirir um cliente vence"';}
},
{id:'c4',title:'Campanha Flash — Caixa em 24-72h',quando:'Quando precisa de receita esta semana sem criar produto novo',fonte:'Invisible Selling Machine — Ryan Deiss + Expert Secrets — Brunson',
fields:[
{id:'oferta_flash',label:'O que você vai oferecer (pode ser oferta existente com condição especial)',ph:'Ex: diagnóstico avulso de 60 min + script personalizado por R$500'},
{id:'lista_flash',label:'Para quem vai enviar (sua lista/seguidores atuais)',ph:'Ex: 500 seguidores ativos no Instagram + 50 contatos no WhatsApp'},
{id:'urgencia_real',label:'Urgência real disponível (não fabricada)',ph:'Ex: só 5 vagas, oferta válida até sexta, preço especial antes do lançamento'}
],
prompt:function(v,ctx){return 'FRAMEWORK: Invisible Selling Machine (Deiss) + Expert Secrets (Brunson) + Campanha Flash\n\n'+ctx+'\n\nOferta: '+v.oferta_flash+'\nAlcance: '+v.lista_flash+'\nUrgência real: '+v.urgencia_real+'\n\nConstrua a campanha flash de 72 horas:\n\nHORA 0 — ANÚNCIO (story + post + DM direto para os 10 mais quentes):\nMensagem de abertura: contexto + oferta + por que agora + CTA claro\n\nHORA 24 — PROVA (story com resultado de quem já comprou OU case relevante):\nSocial proof + lembrete da urgência\n\nHORA 48 — OBJEÇÃO (responda a principal objeção publicamente):\nPost/story que derruba a objeção mais comum + novo CTA\n\nHORA 60 — URGÊNCIA (penúltima chance):\nMensagem direta para quem demonstrou interesse mas não comprou\n\nHORA 72 — ENCERRAMENTO:\nÚltima chamada + fechamento definitivo\n\nEntregue: mensagem exata para cada momento + DM para os 10 leads mais quentes + como qualificar as respostas';}
},
{id:'c5',title:'Bullets Bencivenga — Alta Conversão',quando:'Quando precisa de bullets para página de vendas, email ou post',fonte:'Bencivenga Bullets — Gary Bencivenga (22 bullets completos)',
fields:[
{id:'produto_ben',label:'O que você está promovendo',ph:'Ex: sistema de conversa comercial para consultores'},
{id:'beneficios_ben',label:'5 benefícios principais (resultado, não feature)',ph:'Ex: fechar no ticket planejado / não negociar mais / saber exatamente onde a conversa vai quebrar'},
{id:'segredo_ben',label:'O "segredo" por trás de cada benefício (a razão específica)',ph:'Ex: porque a sequência correta faz o prospect construir o valor antes de ver o número'}
],
prompt:function(v,ctx){return 'FRAMEWORK: Bencivenga Bullets — Gary Bencivenga ("The Bullet Secret": Benefício + Razão Específica)\n\n'+ctx+'\n\nProduto: '+v.produto_ben+'\nBenefícios: '+v.beneficios_ben+'\nSegredo por trás: '+v.segredo_ben+'\n\nO SEGREDO DE BENCIVENGA:\nTodo bullet poderoso tem 2 elementos: (1) benefício específico + (2) razão específica pela qual funciona\n"Como [benefício específico]… mesmo que [objeção comum]" é uma das estruturas mais poderosas\n\nCrie 10 bullets usando diferentes estruturas de Bencivenga:\n1. "O segredo de [resultado]"\n2. "Como [resultado] em [tempo]… sem [sacrifício]"\n3. "Por que [crença comum] é errada — e o que funciona de verdade"\n4. "A [adjetivo] razão pela qual [resultado acontece]"\n5. "O que [tipo de pessoa] sabe sobre [tema] que você provavelmente nunca vai ouvir"\n6. "[Número] de [coisas] que [resultado específico]"\n7. "Como evitar [erro comum] que [custo específico]"\n8-10: variações customizadas para o produto específico\n\nEntregue: 10 bullets + diagnóstico de qual funciona melhor para cada parte do funil (topo, meio, fundo)';}
},
{id:'c6',title:'Pré-venda Conversacional — Makepeace',quando:'Quando a copy está soando como venda e o prospect se fecha antes de ouvir a oferta',fonte:'Clayton Makepeace — Pré-venda e Linguagem Conversacional (Vol. 1 e 2)',
fields:[
{id:'copy_atual',label:'Um trecho da copy atual que está soando como pitch',ph:'Ex: "Descubra o método revolucionário que vai transformar sua carreira…"'},
{id:'prospect_make',label:'Quem vai ler (nível de ceticismo do ICP)',ph:'Ex: consultor que já comprou cursos antes e não teve resultado — altamente cético'},
{id:'objetivo_make',label:'O que você quer que o prospect faça ao ler',ph:'Ex: clicar para saber mais / mandar uma DM / se inscrever na lista'}
],
prompt:function(v,ctx){return 'FRAMEWORK: Clayton Makepeace — Pré-venda e Linguagem Conversacional (Momentum + Conversação)\n\n'+ctx+'\n\nCopy atual: '+v.copy_atual+'\nNível de ceticismo: '+v.prospect_make+'\nObjetivo: '+v.objetivo_make+'\n\nPrincípios de Makepeace:\n1. PRÉ-VENDA: antes de apresentar qualquer oferta, o prospect já deve estar 90% convencido\n2. MOMENTUM: cada frase deve criar um mini-comprometimento que torna difícil parar de ler\n3. LINGUAGEM CONVERSACIONAL: escreva como você fala — não como um anúncio\n4. CRENÇA PROGRESSIVA: construa crença passo a passo, não peça um salto de fé\n\nDiagnostique a copy atual:\n- Em que ponto a linguagem vira "pitch"?\n- Qual é o nível de ceticismo ativo que a copy não está endereçando?\n- O momentum está sendo construído ou quebrado?\n\nReescreva usando a técnica de pré-venda conversacional:\n1. Abra com a dor/situação (sem mencionar produto)\n2. Construa o momentum com descobertas progressivas\n3. Introduza a solução como consequência natural da conversa\n4. CTA como próximo passo lógico — não como pedido';}
},
{id:'c7',title:'Plano IBB 30 dias — Frank Kern',quando:'Quando precisa criar sistema de aquecimento que gera demanda invisível',fonte:'Intent Based Branding — Frank Kern',
fields:[
{id:'pilares_ibm',label:'Seus 3 pilares de autoridade (do M6)',ph:'Ex: 1) objeção de preço não é sobre preço / 2) sistema vs improviso / 3) valor antes do número'},
{id:'audiencia_ibm',label:'Tamanho e plataforma da audiência atual',ph:'Ex: 1.800 seguidores no Instagram, lista de 300 emails, 50 contatos ativos no WhatsApp'},
{id:'oferta_ibm',label:'O que você vai apresentar ao final dos 30 dias',ph:'Ex: sistema de conversa comercial — R$6k'}
],
prompt:function(v,ctx){return 'FRAMEWORK: Intent Based Branding — Frank Kern (Demonstração + Resultado + Autoridade em rotação)\n\n'+ctx+'\n\nPilares: '+v.pilares_ibm+'\nAudiência: '+v.audiencia_ibm+'\nOferta ao final: '+v.oferta_ibm+'\n\nOs 3 tipos de conteúdo IBB:\n1. DEMONSTRAÇÃO: você aplicando o mecanismo em público (diagnóstico ao vivo, análise de caso real)\n2. RESULTADO: antes/depois específico de cliente com perfil similar (não resultado máximo — resultado típico)\n3. AUTORIDADE: ponto de vista defensável sobre o problema (o que a maioria não diz mas você pode provar)\n\nConstrua o calendário de 30 dias:\n\nSEMANA 1 — CONSTRUÇÃO DE CONTEXTO:\n[Dia a dia com tipo de conteúdo + tema + formato]\n\nSEMANA 2 — APROFUNDAMENTO:\n[Demonstração ao vivo + resultado + autoridade]\n\nSEMANA 3 — PRÉ-VENDA:\n[Preparação para a oferta sem mencionar a oferta]\n\nSEMANA 4 — ABERTURA + FOLLOW-UP:\n[Sequência de apresentação da oferta]\n\nEntregue: calendário dia a dia + ideia específica de conteúdo para cada publicação + como intercalar os 3 tipos em proporção correta';}
},
{id:'c8',title:'Script de Webinar/Live de Vendas',quando:'Quando precisa vender para um grupo ao vivo sem soar como pitch',fonte:'Expert Secrets — Russell Brunson (Perfect Webinar Script)',
fields:[
{id:'tema_web',label:'Tema do webinar (o que você vai ensinar)',ph:'Ex: "Como fechar clientes de alto ticket sem negociar preço"'},
{id:'oferta_web',label:'O que você vai apresentar ao final',ph:'Ex: sistema de conversa comercial — R$6k'},
{id:'crencas_web',label:'3 crenças que o público precisa ter para comprar',ph:'Ex: 1) o problema é solucionável / 2) o método deles é o certo / 3) agora é o momento certo'}
],
prompt:function(v,ctx){return 'FRAMEWORK: Expert Secrets — Russell Brunson (Perfect Webinar Script + Stack)\n\n'+ctx+'\n\nTema: '+v.tema_web+'\nOferta: '+v.oferta_web+'\nCrenças necessárias: '+v.crencas_web+'\n\nEstrutura do Perfect Webinar Script:\n\nINTRO (10 min):\n- Big Promise: o resultado específico que aprenderão\n- Hook: por que você é o guia certo (experiência, não credencial)\n- Agenda: o que vão cobrir\n\nCONTEÚDO (40 min) — 3 Segredos que derrubam as 3 crenças falsas:\nSegredo 1: [derruba crença falsa 1] — Ensine o conceito + história de epifania\nSegredo 2: [derruba crença falsa 2] — Ensine o conceito + história de epifania\nSegredo 3: [derruba crença falsa 3] — Ensine o conceito + história de epifania\n\nTRANSIÇÃO (5 min):\n"Agora que você entende X, Y e Z, deixa eu te mostrar como acelerar isso…"\n\nO STACK (15 min):\nApresente a oferta empilhando elementos com valor percebido crescente\nPreço com âncora → ticket real → CTA\n\nQ&A E URGÊNCIA (10 min)\n\nEntregue: script completo com timing + as 3 histórias de epifania + stack de oferta + os CTAs específicos';}
}
,{id:'a7',title:'Auditoria de Apresentação com Resonate',quando:'Quando uma live, pitch ou webinar não gera a resposta comercial esperada',fonte:'Resonate — Nancy Duarte',
fields:[
{id:'apresentacao_d',label:'Descreva a apresentação (tema, estrutura, como você conduz)',ph:'Ex: live de 60 min — apresento o problema, mostro meu método, faço oferta — mas ninguém pergunta sobre a oferta'},
{id:'audiencia_d',label:'Quem é a audiência e o que acredita ao entrar',ph:'Ex: consultores que reconhecem o problema mas acham que precisam de mais clientes, não de sistema'},
{id:'transformacao_d',label:'Como a audiência deveria sair diferente de como entrou',ph:'Ex: convencida de que o problema é de sistema e que pode ser resolvido em 6 semanas'}
],
prompt:function(v,ctx){return 'FRAMEWORK: Resonate — Nancy Duarte (What Is / What Could Be + S.T.A.R Moment + Hero Journey)\n\n'+ctx+'\n\nApresentação atual: '+v.apresentacao_d+'\nAudiência e crença de entrada: '+v.audiencia_d+'\nTransformação esperada: '+v.transformacao_d+'\n\nO modelo Duarte: toda apresentação poderosa oscila entre WHAT IS (o mundo atual) e WHAT COULD BE (o mundo possível). A audiência é o herói — não o apresentador.\n\nDiagnostique:\n1. HERO: a audiência está sendo tratada como herói ou como receptor de informação?\n2. WHAT IS vs WHAT COULD BE: a apresentação oscila entre os dois mundos ou só descreve o que é?\n3. THE CALL TO ADVENTURE: o convite à mudança está explícito e emocional?\n4. S.T.A.R MOMENT: existe Something They Always Remember — o pico emocional memorável?\n5. RESOLUTION: a visão do futuro possível está descrita de forma concreta e desejável?\n\nEntregue:\n1. Diagnóstico dos 3 problemas principais da estrutura atual\n2. Estrutura recomendada com momentos de What Is / What Could Be identificados\n3. O S.T.A.R moment sugerido para esta apresentação\n4. Reescrita da abertura (primeiros 3 minutos) e do fechamento';}
}
]
},
{
id:'auditoria',icon:'🔍',name:'Auditoria & Operação Semanal',
desc:'Revisar, diagnosticar e refinar o que já existe com precisão cirúrgica',
prompts:[
{id:'a1',title:'Auditoria de Copy Completa',quando:'Quando um post, email ou página não está convertendo como esperado',fonte:'The Copywriter's Handbook — Robert Bly + Clayton Makepeace',
fields:[
{id:'copy_aud',label:'Cole o texto que quer auditar',ph:'Cole aqui o post, email, headline ou qualquer copy para análise'},
{id:'objetivo_aud',label:'Qual era o objetivo deste texto',ph:'Ex: gerar DMs de prospects qualificados / converter em clique para link / nutrir lead frio'},
{id:'resultado_aud',label:'O resultado real que teve',ph:'Ex: 50 visualizações, 2 likes, 0 DMs — abaixo do esperado'}
],
prompt:function(v,ctx){return 'FRAMEWORK: The Copywriter's Handbook (Bly) + Clayton Makepeace Copywriting Framework\n\n'+ctx+'\n\nTexto para auditoria:\n—\n'+v.copy_aud+'\n—\nObjetivo: '+v.objetivo_aud+'\nResultado real: '+v.resultado_aud+'\n\nAuditoria pelos critérios de Bly:\n1. HEADLINE: captura atenção? Promete benefício específico? Seleciona o leitor certo?\n2. LEAD: os primeiros 50 words são irresistíveis? Ou genéricos?\n3. BENEFÍCIOS vs. FEATURES: o texto vende benefícios ou só lista características?\n4. PROVA: existe credibilidade? (dados, casos, autoridade)\n5. OFERTA: o CTA é claro, específico e de baixo atrito?\n6. MOMENTUM: cada parágrafo leva o leitor ao próximo?\n7. LINGUAGEM: é conversacional? Ou soa como copy?\n\nAuditoria pelos critérios de Makepeace:\n1. O nível de ceticismo do leitor foi considerado?\n2. A pré-venda está presente antes de qualquer pedido?\n\nEntregue:\n1. Diagnóstico dos 3 maiores problemas (em ordem de impacto)\n2. Versão reescrita dos primeiros 3 parágrafos\n3. Headline alternativo (3 versões)\n4. CTA reescrito';}
},
{id:'a2',title:'OODA Semanal Assistido',quando:'Toda segunda-feira — revisar semana e tomar 1 decisão de ajuste',fonte:'Loop OODA — John Boyd',
fields:[
{id:'metricas_ooda',label:'Números da semana anterior',ph:'Ex: 5 DMs enviadas / 2 triagens passadas / 1 proposta apresentada / 0 fechamentos / 3 follow-ups'},
{id:'esperado_ooda',label:'O que era esperado acontecer',ph:'Ex: esperava 2 triagens passadas, 1 diagnóstico marcado, 1 fechamento'},
{id:'obstaculo_ooda',label:'O maior obstáculo da semana (em 1 frase)',ph:'Ex: leads chegaram mas nenhum tinha urgência real / apresentei a oferta antes da triagem completa'}
],
prompt:function(v,ctx){return 'FRAMEWORK: Loop OODA — John Boyd (Observe → Orient → Decide → Act)\n\n'+ctx+'\n\nMétricas da semana: '+v.metricas_ooda+'\nO que era esperado: '+v.esperado_ooda+'\nMaior obstáculo: '+v.obstaculo_ooda+'\n\nCiclo OODA desta semana:\n\nOBSERVE (o que os dados mostram — sem interpretar ainda):\n- Qual é o gap entre esperado e real?\n- Qual etapa do funil está abaixo?\n- Quais dados são confiáveis e quais são ruído?\n\nORIENT (o que os dados revelam — depois de interpretar):\n- O gap é de volume (poucas ações) ou de conversão (ações sem resultado)?\n- Qual é a causa raiz do maior obstáculo?\n- O que mudou no ambiente que pode estar afetando os resultados?\n\nDECIDE (1 ajuste — não 5):\n- Qual é a 1 mudança com maior impacto potencial esta semana?\n- Como você vai implementar?\n- Como vai medir se funcionou?\n\nACT:\n- Ação específica + data + critério de sucesso\n\nEntregue: diagnóstico completo OODA + 1 decisão de ajuste clara e mensurável';}
},
{id:'a3',title:'After Action Review de Campanha',quando:'Após qualquer ação comercial — DM, proposta, campanha, live',fonte:'After Action Review (AAR) — US Army',
fields:[
{id:'acao_aar',label:'Qual foi a ação (descreva o que aconteceu)',ph:'Ex: enviei 15 DMs de abertura esta semana, 5 responderam, 2 avançaram para WhatsApp, 0 fechamentos'},
{id:'intencao_aar',label:'O que era esperado acontecer',ph:'Ex: esperava 8 respostas, 4 triagens, 1 diagnóstico marcado'},
{id:'gap_aar',label:'Onde exatamente divergiu do esperado',ph:'Ex: as aberturas não geraram respostas suficientes — problema na etapa 1 da DM'}
],
prompt:function(v,ctx){return 'FRAMEWORK: After Action Review (AAR) — US Army (What was planned? What happened? Why? What to do differently?)\n\n'+ctx+'\n\nAção realizada: '+v.acao_aar+'\nO que era esperado: '+v.intencao_aar+'\nOnde divergiu: '+v.gap_aar+'\n\nAs 4 perguntas do AAR:\n\n1. O QUE ERA ESPERADO?\nDescreva a intenção original — não o que parecia razoável depois, mas o que você planejou antes\n\n2. O QUE ACONTECEU DE FATO?\nFatos objetivos — sem interpretação ainda\nOs números: [analise os dados fornecidos]\n\n3. POR QUE DIVERGIU?\nDiagnostique a causa raiz:\n- Foi de planejamento (o plano estava errado)?\n- Foi de execução (o plano estava certo mas não foi executado)?\n- Foi de contexto (algo externo mudou)?\n- Foi de diagnóstico (o ICP era diferente do esperado)?\n\n4. O QUE MUDA NA PRÓXIMA?\n1 ação específica — não uma lista de intenções\n\nEntregue: AAR completo + diagnóstico de causa raiz + 1 ajuste operacional para a próxima ação semelhante';}
},
{id:'a4',title:'Diagnóstico "Por que não estou vendendo"',quando:'Quando os números estão abaixo e você não sabe onde está o problema',fonte:'Multi-framework: Schwartz + Cialdini + Hormozi + OODA',
fields:[
{id:'situacao_diag',label:'Descreva sua situação atual (números e contexto)',ph:'Ex: 200 seguidores ativos, poste 4x/semana, recebo 2-3 DMs por semana mas nenhuma vira cliente'},
{id:'funil_diag',label:'Descreva onde os leads chegam e onde somem',ph:'Ex: chegam via post, respondem com interesse, pedem informação, depois somem quando falo o preço'},
{id:'oferta_diag',label:'Sua oferta atual e como você apresenta',ph:'Ex: menciono que tenho um programa de 6 semanas e mando o preço quando perguntam'}
],
prompt:function(v,ctx){return 'DIAGNÓSTICO COMERCIAL MULTI-FRAMEWORK: Schwartz + Cialdini + Hormozi + Boyd\n\n'+ctx+'\n\nSituação: '+v.situacao_diag+'\nFunil atual: '+v.funil_diag+'\nOferta e apresentação: '+v.oferta_diag+'\n\nDiagnostique em 5 dimensões:\n\n1. PROBLEMA DE ESTÁGIO (Schwartz):\nOs leads estão no estágio de consciência certo? A mensagem está calibrada para o estágio deles?\n\n2. PROBLEMA DE SEQUÊNCIA (Cialdini):\nOs 6 princípios estão sendo aplicados na sequência certa? Ou está pulando para a oferta sem reciprocidade?\n\n3. PROBLEMA DE VALOR PERCEBIDO (Hormozi):\nQual componente da equação de valor está fraco? (RD muito vago? PP muito baixa? T longo demais? E alto demais?)\n\n4. PROBLEMA DE TRIAGEM (ICP):\nOs leads que chegam são ICPs com dor ativa ou ICPs com curiosidade crônica? A oferta está sendo apresentada para não-ICPs?\n\n5. PROBLEMA DE SEQUÊNCIA COMERCIAL:\nO preço está aparecendo antes do valor ser estabelecido? Há âncora antes do ticket?\n\nEntregue:\n1. Os 3 diagnósticos mais prováveis em ordem de probabilidade\n2. O teste de 48h para confirmar qual é o problema real\n3. O ajuste prioritário para cada diagnóstico';}
},
{id:'a5',title:'Auditoria de Posicionamento vs. Concorrência',quando:'Quando você sente que está sendo comparado e perdendo por preço',fonte:'Breakthrough Advertising (Schwartz) + Play Bigger + Obviously Awesome (Dunford)',
fields:[
{id:'concorrentes_aud',label:'Quem são os 3 principais concorrentes que você enfrenta',ph:'Ex: outros consultores de posicionamento, cursos de copywriting, agências de conteúdo'},
{id:'pos_atual_aud',label:'Como você se posiciona hoje vs. eles',ph:'Ex: me posiciono como mais especializado, com framework próprio, resultado garantido'},
{id:'onde_perde',label:'Em que situações você perde para eles',ph:'Ex: quando o cliente compara preço, quando não me conhece e vê opção mais barata'}
],
prompt:function(v,ctx){return 'FRAMEWORK: Breakthrough Advertising (Schwartz) + Play Bigger (Lochhead) + Obviously Awesome (Dunford)\n\n'+ctx+'\n\nConcorrentes: '+v.concorrentes_aud+'\nPositionamento atual: '+v.pos_atual_aud+'\nOnde perde: '+v.onde_perde+'\n\nAuditoria de posicionamento em 4 dimensões:\n\n1. SOFISTICAÇÃO DE MERCADO (Schwartz):\nEstá no estágio correto? Ou usando claim de E1-2 em mercado de E4-5?\nO que está saturado na mensagem que não diferencia mais?\n\n2. CATEGORIA (Play Bigger):\nVocê está competindo DENTRO de uma categoria ou CRIANDO uma nova?\nSe está dentro: está usando o diferenciador correto para este estágio?\nSe está criando: o nome da categoria é claro e o inimigo está definido?\n\n3. TESTE OBVIOUSLY AWESOME (Dunford):\nOs clientes que mais te amam — o que eles valorizam que a concorrência não oferece?\nEsse valor está sendo comunicado como central ou como bônus?\n\n4. FRAME DE COMPARAÇÃO:\nQuando o prospect compara você com um concorrente, o frame é de preço ou de resultado?\nComo você pode mudar o frame antes que a comparação aconteça?\n\nEntregue:\n1. Diagnóstico de onde o posicionamento atual está mais vulnerável\n2. Reposicionamento estratégico recomendado\n3. Mensagem de diferenciação que muda o frame de comparação\n4. Como comunicar isso nas próximas 48 horas';}
},
{id:'a6',title:'Revisão de Pipeline com Cialdini',quando:'Quando o pipeline está parado e você não sabe o que fazer com cada lead',fonte:'Influence — Robert Cialdini + Pre-suasion — Robert Cialdini',
fields:[
{id:'pipeline_aud',label:'Descreva os leads no seu pipeline agora (quantos, estágio, última interação)',ph:'Ex: 8 leads — 2 receberam proposta há 1 semana, 3 em conversa ativa, 3 frios há 2+ semanas'},
{id:'maior_grupo',label:'Qual grupo é o maior problema agora',ph:'Ex: os 2 que receberam proposta e não responderam — são os mais quentes'},

prompt:function(v,ctx){return 'FRAMEWORK: Influence + Pre-suasion — Robert Cialdini (6 Princípios como Diagnóstico de Pipeline)\n\n'+ctx+'\n\nPipeline atual: '+v.pipeline_aud+'\nMaior grupo problema: '+v.maior_grupo+'\nTempo disponível: '+v.recursos_pipe+'\n\nDiagnostique cada grupo do pipeline pelos 6 princípios de Cialdini:\n\nRECIPROCIDADE: esses leads receberam valor antes da oferta? Ou você foi direto ao pitch?\nCOMPROMETIMENTO: qual foi o último micro-sim que eles deram? Estão comprometidos com o problema?\nPROVA SOCIAL: eles viram evidência de que funciona para perfis similares a eles?\nAUTORIDADE: qual foi o momento de demonstração de autoridade (diagnóstico, insight, case)?\nAFINIDADE: existe conexão real ou a conversa foi puramente comercial?\nESCASSSEZ: existe urgência real para eles decidirem agora versus depois?\n\nPara cada grupo do pipeline, entregue:\n1. Diagnóstico de qual princípio está ausente ou fraco\n2. A ação específica para ativar este princípio (mensagem pronta)\n3. Priorização: qual lead trabalhar primeiro com o tempo disponível\n4. O que fazer com os leads frios que provavelmente não vão avançar';}
}
,{id:'a7',title:'Auditoria de Apresentação com Resonate',quando:'Quando uma live, pitch ou webinar não gera a resposta comercial esperada',fonte:'Resonate — Nancy Duarte',
fields:[
{id:'apresentacao_d',label:'Descreva a apresentação (tema, estrutura, como você conduz)',ph:'Ex: live de 60 min — apresento o problema, mostro meu método, faço oferta — mas ninguém pergunta sobre a oferta'},
{id:'audiencia_d',label:'Quem é a audiência e o que acredita ao entrar',ph:'Ex: consultores que reconhecem o problema mas acham que precisam de mais clientes, não de sistema'},
{id:'transformacao_d',label:'Como a audiência deveria sair diferente de como entrou',ph:'Ex: convencida de que o problema é de sistema e que pode ser resolvido em 6 semanas'}
],
prompt:function(v,ctx){return 'FRAMEWORK: Resonate — Nancy Duarte (What Is / What Could Be + S.T.A.R Moment + Hero Journey)\n\n'+ctx+'\n\nApresentação atual: '+v.apresentacao_d+'\nAudiência e crença de entrada: '+v.audiencia_d+'\nTransformação esperada: '+v.transformacao_d+'\n\nO modelo Duarte: toda apresentação poderosa oscila entre WHAT IS (o mundo atual) e WHAT COULD BE (o mundo possível). A audiência é o herói — não o apresentador.\n\nDiagnostique:\n1. HERO: a audiência está sendo tratada como herói ou como receptor de informação?\n2. WHAT IS vs WHAT COULD BE: a apresentação oscila entre os dois mundos ou só descreve o que é?\n3. THE CALL TO ADVENTURE: o convite à mudança está explícito e emocional?\n4. S.T.A.R MOMENT: existe Something They Always Remember — o pico emocional memorável?\n5. RESOLUTION: a visão do futuro possível está descrita de forma concreta e desejável?\n\nEntregue:\n1. Diagnóstico dos 3 problemas principais da estrutura atual\n2. Estrutura recomendada com momentos de What Is / What Could Be identificados\n3. O S.T.A.R moment sugerido para esta apresentação\n4. Reescrita da abertura (primeiros 3 minutos) e do fechamento';}
}
]
}
];

icp:'Você é OZAKA, especialista em comportamento do comprador do Position Ops 2.0.\n\nBases ativas: Demand-Side Sales 101 (Moesta — JTBD + 4 Forces: Push/Pull/Anxiety/Habit + Timeline de compra), JTBD Playbook (Kalbach — Job Map + Progress Making), Obviously Awesome (Dunford — 10-step positioning process + competitive alternatives), The Mom Test (Fitzpatrick — perguntas que revelam verdade sem validação social), Deploy Empathy (Hansen — silêncio estratégico + "me conta mais"), Mapping Experiences (Kalbach — Experience Map: doing/thinking/feeling/pain/moments of truth), Buyology (Lindstrom — somatic markers + mirror neurons + rituais), Predictably Irrational (Ariely — efeito dotação + ancoragem + custo zero + normas sociais), Blind Spot (Banaji — vieses inconscientes + implicit associations).\n\nSua função: EXECUTAR. Entregue roteiros de entrevista prontos para usar, diagnósticos de comportamento com causa raiz identificada, mapas de jornada com intervenções específicas.',

};

function arsPromptCard(p,date,hasOut){

return '<div id="apbtn-'+p.id+'" onclick="arsSelectPrompt(\''+activeCategory+'\',\''+p.id+'\')" style="padding:10px 12px;border-bottom:1px solid var(--b);cursor:pointer;transition:background .12s" onmouseover="if(window._ars_active!==\''+p.id+'\')this.style.background=\'var(--s3)\'" onmouseout="if(window._ars_active!==\''+p.id+'\')this.style.background=\'transparent\'">'
+'<div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:3px">'
+'<span style="font-family:Lora,serif;font-size:12px;color:var(--text);line-height:1.4">'+p.title+'</span>'
+(hasOut?'<span style="font-size:11px;color:var(--gold);flex-shrink:0;margin-left:4px;margin-top:2px">✓</span>':'')
+'</div>'
+'<div style="font-family:DM Mono,monospace;font-size:11px;color:var(--text4);line-height:1.4">'+p.quando.substring(0,60)+'</div>'
+(date?'<div style="margin-top:4px">'+badge+'</div>':'')
+'</div>';
}

window.arsFilterPrompts=function(catId){
var q=(document.getElementById('arsSearch')||{value:''}).value.toLowerCase();
var cat=null;CATS.forEach(function(c){if(c.id===catId)cat=c;});
if(!cat)return;
var items=document.getElementById('arsPromptItems');
if(!items)return;
var filtered=cat.prompts.filter(function(p){
return p.title.toLowerCase().includes(q)||p.quando.toLowerCase().includes(q)||p.fonte.toLowerCase().includes(q);
});
if(filtered.length===0){
items.innerHTML='<div style="padding:16px;font-family:DM Mono,monospace;font-size:10px;color:var(--text4);text-align:center">Nenhum prompt encontrado</div>';
return;
}
var lh='';
filtered.forEach(function(p){
var date=arsGetDate(p.id);var hasOut=arsGetOutput(p.id)!='';
lh+=arsPromptCard(p,date,hasOut);
});
items.innerHTML=lh;
};

function arsRenderResult(text,promptId){
var formatted=text
.replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>')
.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
.replace(/^#{1,3} (.+)$/gm,'<div style="font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;font-weight:500;font-size:15px;letter-spacing:.04em;color:var(--gold);margin:14px 0 5px">$1</div>')
.replace(/^(\d+). /gm,'<br><strong style="color:var(--text3)">$1.</strong> ')
.replace(/^[-•] /gm,'<br><span style="color:var(--gold)">•</span> ')
.replace(/\n\n/g,'</p><p style="margin:0 0 10px">')
.replace(/\n/g,'<br>');
var pid=promptId||'unknown';
return '<div style="background:var(--s1);border:1px solid rgba(201,168,76,.25);border-radius:6px;overflow:hidden">'
+'<div style="display:flex;align-items:center;justify-content:space-between;padding:9px 14px;background:rgba(201,168,76,.06);border-bottom:1px solid rgba(201,168,76,.15);flex-wrap:wrap;gap:6px">'
+'<span style="font-family:DM Mono,monospace;font-size:11px;color:var(--gold);letter-spacing:.1em;text-transform:uppercase">⬡ OZAKA — Output</span>'
+'<div style="display:flex;gap:6px">'
+'<button onclick="copyTxt(this,document.getElementById(\'arsResultText_'+pid+'\').innerText)" style="font-family:DM Mono,monospace;font-size:11px;padding:3px 9px;border-radius:3px;border:1px solid var(--b2);background:transparent;cursor:pointer;color:var(--text3)">Copiar</button>'
+'<button onclick="arsCopyForDocs(\''+pid+'\')" style="font-family:DM Mono,monospace;font-size:11px;padding:3px 9px;border-radius:3px;border:1px solid var(--b2);background:transparent;cursor:pointer;color:var(--text3)">→ Docs Mestre</button>'
+'<button onclick="arsGenerate()" style="font-family:DM Mono,monospace;font-size:11px;padding:3px 9px;border-radius:3px;border:1px solid var(--b2);background:transparent;cursor:pointer;color:var(--text3)">↺ Regerar</button>'
+'</div>'
+'</div>'
+'<div id="arsResultText_'+pid+'" style="padding:18px 20px;font-family:Lora,serif;font-size:13px;color:var(--text);line-height:1.85"><p style="margin:0 0 10px">'+formatted+'</p></div>'
+'</div>';
}

// ── MODULE PROGRESS ──
function modProgress(modId){
var mod=MODULES.find(function(m){return m.id===modId;});
if(!mod)return{done:0,total:0,pct:0};
var total=mod.lessons.length;
var done=0;
for(var li=0;li<total;li++){
// check if all checklist items done or textarea has content
var ta=loadTA(modId+'_'+li);
if(ta&&ta.length>20) done++;
}
return{done:done,total:total,pct:total>0?Math.round(done/total*100):0};
}

function scrollToLesson(currentLi, direction){
var main=document.getElementById('apMain');
var items=main.querySelectorAll('.lesson-item');
var targetIdx=currentLi+direction;
if(targetIdx<0||targetIdx>=items.length)return;
// Close current, open target
items[currentLi].classList.remove('open');
items[targetIdx].classList.add('open');
items[targetIdx].scrollIntoView({behavior:'smooth',block:'start'});
}

        ${checklist(lesson.check,id,li)}
      </div>
      
      <div class="response-area">
        <div class="ra-header">
          <span class="ra-label">✍ Sua resposta — cole o output do GPT aqui</span>
          <div class="ra-actions">
            <button class="ra-btn" onclick="this.closest('.response-area').querySelector('textarea').value='';saveTA('${id}_${li}','')">Limpar</button>
            <button class="ra-btn primary" onclick="copyForDocs(this,'${id}',${li})">📋 Copiar para Docs Mestre</button>
          </div>
        </div>
        <textarea class="ra-input" data-ta-key="${id}_${li}" placeholder="Cole aqui o output gerado pelo GPT após a sessão desta aula..." oninput="saveTA('${id}_${li}',this.value)">${loadTA(id+'_'+li)}</textarea>
        <div class="ra-hint">Texto salvo automaticamente · Cole no Docs Mestre na seção correspondente</div>
      </div>
      
      <div class="lesson-nav" style="display:flex;justify-content:space-between;padding:16px 0 4px">
        ${li > 0 ? '<button class="ln-btn" onclick="scrollToLesson('+li+','+(-1)+')">← Aula anterior</button>' : '<span></span>'}
        ${li < mod.lessons.length-1 ? '<button class="ln-btn" onclick="scrollToLesson('+li+',1)">Próxima aula →</button>' : '<span></span>'}
      </div>
      
    </div>
  </div>
`;


});

html += '</div>';
main.innerHTML = html;
main.scrollTop = 0;
}

function arqNode(num,agent,agBadge,title,desc,fws,output,cls,side){
const fw = fws.split(',').map(f=>`<span>${f.trim()}</span>`).join('');
return `<div class="arq-row ${side==='right'?'flip':''}">
<div class="arq-node ${cls}">
<div class="an-top"><span class="an-num">${num}</span><span class="an-badge ${agBadge}">${agent}</span></div>
<div class="an-title">${title}</div>
<div class="an-desc">${desc}</div>
<div class="an-fw">${fw}</div>
<div class="an-out"><div class="an-out-l">Output</div><div class="an-out-t">${output}</div></div>
</div>
<div class="arq-conn"><div class="arq-dot"></div></div>
<div></div>

  </div>`;
}

function arqGate(cls,sym,title,desc,checks){
const chk = checks.split(',').map(c=>`<div class="agc">${c.trim()}</div>`).join('');
return `<div class="arq-gate-wrap"><div class="arq-gate ${cls}"><div class="ag-sym">${sym}</div><div class="ag-title">${title}</div><div class="ag-desc">${desc}</div><div class="ag-checks">${chk}</div></div></div>`;
}
