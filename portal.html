<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Position Ops 2.0 — Área de Membros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#111111;--s1:#181818;--s2:#1E1E1E;--s3:#252525;--s4:#2E2E2E;--s5:#383838;
  --dark:#111111;--surface1:#181818;--surface2:#1E1E1E;--surface3:#252525;
  --text:#EFEFEF;--text2:#9A9A9A;--text3:#5C5C5C;--text4:#363636;
  --text-dim:#9A9A9A;--text-faint:#363636;
  --b:rgba(255,255,255,.055);--b2:rgba(255,255,255,.09);--b3:rgba(255,255,255,.13);
  --border:rgba(255,255,255,.055);--border2:rgba(255,255,255,.09);--border-strong:rgba(255,255,255,.13);
  --gold:#B8922A;--gold-dim:#6B561A;--gold-glow:rgba(184,146,42,.1);--gold-bg:rgba(184,146,42,.06);
  --purple:#7B72E9;--purple-d:rgba(123,114,233,.1);
  --teal:#3A9972;--teal-d:rgba(58,153,114,.1);
  --red:#C94040;--red-d:rgba(201,64,64,.1);
  --blue:#4A88CC;--blue-d:rgba(74,136,204,.1);
  --orange:#C07028;--orange-d:rgba(192,112,40,.1);
  --green:#4A9055;--green-d:rgba(74,144,85,.1);
  --f-xs:11px;--f-sm:13px;--f-md:14px;--f-lg:16px;--f-xl:22px;--f-2xl:30px;--f-3xl:42px;
  --sp1:4px;--sp2:8px;--sp3:12px;--sp4:16px;--sp5:20px;--sp6:24px;--sp7:28px;--sp8:32px;--sp10:40px;--sp12:48px;
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:24px;--sp-7:28px;--sp-8:32px;--sp-10:40px;--sp-12:48px;
  --r:4px;--r-sm:3px;--r-lg:6px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--s4);border-radius:2px}
::-webkit-scrollbar-thumb:hover{background:var(--s5)}
::selection{background:rgba(184,146,42,.15);color:var(--text)}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid rgba(184,146,42,.4);outline-offset:2px}
details summary::-webkit-details-marker{display:none}
#login{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg)}
.lg-logo{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.2em;color:var(--text3);text-transform:uppercase;margin-bottom:32px}
.lg-card{width:320px;padding:40px 32px 32px;background:var(--s1);border:1px solid var(--b2);border-radius:var(--r-lg)}
.lg-title{font-size:var(--f-lg);font-weight:500;color:var(--text);text-align:center;margin-bottom:4px;letter-spacing:-.01em}
.lg-sub{font-family:'DM Mono',monospace;font-size:var(--f-xs);color:var(--text3);letter-spacing:.06em;text-transform:uppercase;text-align:center;margin-bottom:32px}
.lg-avatar{width:48px;height:48px;border-radius:50%;background:var(--s3);border:1px solid var(--b2);display:flex;align-items:center;justify-content:center;margin:0 auto 24px}
.lg-avatar svg{opacity:.5}
.lg-label{font-family:'DM Mono',monospace;font-size:var(--f-xs);color:var(--text3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px;display:block}
.pin-wrap{display:flex;gap:10px;justify-content:center;margin-bottom:24px}
.pin-input{width:46px;height:50px;background:var(--s2);border:1px solid var(--b);border-radius:var(--r);text-align:center;font-size:var(--f-xl);color:var(--text);caret-color:transparent;transition:border-color .15s}
.pin-input:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-glow)}
.pin-input.filled{border-color:var(--gold-dim)}
.pin-input.shake{animation:shake .3s ease}
.lg-msg{font-family:'DM Mono',monospace;font-size:var(--f-xs);height:20px;color:var(--red);letter-spacing:.04em;text-align:center;margin-bottom:16px}
.lg-hint{margin-top:20px;font-family:'DM Mono',monospace;font-size:var(--f-xs);color:var(--text4);letter-spacing:.04em;text-align:center}
#app{display:none;flex-direction:column;height:100%;animation:fadeIn .2s ease both}
.topbar{height:46px;flex-shrink:0;background:var(--s1);border-bottom:1px solid var(--b);display:flex;align-items:center;padding:0 24px;gap:0;z-index:10}
.tb-brand{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.1em;color:var(--text3);margin-right:32px;white-space:nowrap;text-transform:uppercase;user-select:none}
.tb-brand span{color:var(--text2)}
.tb-tabs{display:flex;gap:0;flex:1}
.tb-tab{font-family:'DM Mono',monospace;font-size:var(--f-xs);letter-spacing:.06em;padding:0 20px;height:46px;display:flex;align-items:center;gap:6px;color:var(--text3);cursor:pointer;border-bottom:1px solid transparent;transition:color .12s,border-color .12s;white-space:nowrap;text-transform:uppercase;user-select:none}
.tb-tab svg{opacity:.4;transition:opacity .12s;flex-shrink:0}
.tb-tab:hover{color:var(--text2)}
.tb-tab:hover svg{opacity:.6}
.tb-tab.active{color:var(--text);border-bottom-color:var(--gold)}
.tb-tab.active svg{opacity:.8}
.tb-right{margin-left:auto;font-family:'DM Mono',monospace;font-size:var(--f-xs);color:var(--text4);letter-spacing:.04em}
.content{flex:1;overflow:hidden;display:flex}
#tab-arq{width:100%;height:100%;overflow-y:auto;padding:40px 48px 80px;display:none}
#tab-inicio{width:100%;height:100%;display:block;overflow-y:auto}
#tab-scripts{width:100%;height:100%;display:none}
#tab-ap{width:100%;height:100%;display:none;flex-direction:row}
#tab-arsenal{width:100%;height:100%;display:none}
.ap-sidebar{width:224px;flex-shrink:0;background:var(--s1);border-right:1px solid var(--b);overflow-y:auto;padding:12px 0}
.sb-section{padding:16px 16px 8px;font-family:'DM Mono',monospace;font-size:10px;color:var(--text4);letter-spacing:.1em;text-transform:uppercase}
.sb-item{display:flex;align-items:center;gap:8px;padding:6px 16px;cursor:pointer;border-left:2px solid transparent;transition:background .1s;position:relative;flex-wrap:wrap}
.sb-item:hover{background:var(--s2)}
.sb-item.active{background:var(--s2);border-left-color:var(--gold)}
.sb-item.active .sb-num{color:var(--gold)}
.sb-item.active .sb-name{color:var(--text)}
.sb-num{font-family:'DM Mono',monospace;font-size:10px;color:var(--text4);min-width:28px;letter-spacing:.03em}
.sb-name{font-size:var(--f-xs);color:var(--text3);line-height:1.3;flex:1}
.sb-item.gate .sb-num{color:var(--red);opacity:.6}
.sb-item.gate.active{border-left-color:var(--red)}
.sb-item.gate.active .sb-num{color:var(--red);opacity:1}
.sb-badge{font-family:'DM Mono',monospace;font-size:9px;padding:1px 5px;border-radius:2px;flex-shrink:0;letter-spacing:.02em}
.badge-y{background:var(--purple-d);color:var(--purple)}
.badge-k{background:var(--teal-d);color:var(--teal)}
.badge-o{background:var(--gold-bg);color:var(--gold)}
.badge-r{background:var(--red-d);color:var(--red)}
.badge-g{background:var(--green-d);color:var(--green)}
.sb-progress-track{width:calc(100% - 32px);height:2px;background:var(--s4);border-radius:1px;margin:3px 16px 2px}
.sb-progress-fill{height:2px;border-radius:1px;transition:width .3s}
.ap-main{flex:1;overflow-y:auto;padding:0}
.mod-header{padding:32px 40px 24px;border-bottom:1px solid var(--b);position:sticky;top:0;z-index:5;background:var(--bg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.mh-eyebrow{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.1em;color:var(--text3);text-transform:uppercase;margin-bottom:8px}
.mh-title{font-size:var(--f-2xl);font-weight:600;color:var(--text);letter-spacing:-.02em;line-height:1.1;margin-bottom:4px}
.mh-sub{font-size:var(--f-sm);color:var(--text3);font-family:'Lora',Georgia,serif;font-style:italic;line-height:1.5}
.mh-meta{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap}
.mh-tag{font-family:'DM Mono',monospace;font-size:10px;padding:2px 8px;border-radius:var(--r-sm);letter-spacing:.03em}
.lessons{padding:24px 32px 80px;max-width:760px}
.lesson-item{border:1px solid var(--b);border-radius:var(--r);margin-bottom:8px;overflow:hidden;transition:border-color .15s}
.lesson-item.open{border-color:var(--b2)}
.lesson-item.done-state{border-color:rgba(58,153,114,.2)}
.lesson-item.done-state .lh-num{color:var(--teal)}
.lesson-head{display:flex;align-items:center;gap:16px;padding:14px 20px;cursor:pointer;transition:background .1s;user-select:none}
.lesson-head:hover{background:var(--s2)}
.lh-num{font-family:'DM Mono',monospace;font-size:11px;color:var(--text4);min-width:28px}
.lh-title{font-size:var(--f-md);color:var(--text);flex:1;font-weight:400;letter-spacing:-.01em}
.lh-time{font-family:'DM Mono',monospace;font-size:11px;color:var(--text4);flex-shrink:0}
.lh-done{font-size:12px;color:var(--teal);flex-shrink:0;opacity:0;transition:opacity .2s}
.lesson-item.done-state .lh-done{opacity:1}
.lh-arrow{font-size:10px;color:var(--text4);transition:transform .2s;flex-shrink:0}
.lesson-item.open .lh-arrow{transform:rotate(180deg)}
.lesson-body{display:none;border-top:1px solid var(--b);padding:32px;max-width:700px}
.lesson-item.open .lesson-body{display:block}
.block{margin-bottom:28px}
.block:last-child{margin-bottom:0}
.block-label{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.1em;color:var(--text4);text-transform:uppercase;display:flex;align-items:center;gap:12px;margin-bottom:16px}
.block-label::after{content:'';flex:1;height:1px;background:var(--b)}
.block-intro p{font-family:'Lora',Georgia,serif;font-size:var(--f-md);color:var(--text2);line-height:1.8;margin-bottom:12px}
.block-intro p:last-child{margin-bottom:0}
.block-aula{background:var(--s2);border-radius:var(--r);padding:24px;border-left:2px solid var(--b3)}
.block-aula p{font-family:'Lora',Georgia,serif;font-size:var(--f-md);color:var(--text);line-height:1.85;margin-bottom:16px}
.block-aula p:last-child{margin-bottom:0}
.block-aula h4{font-size:var(--f-sm);font-weight:600;color:var(--text);letter-spacing:-.01em;margin:16px 0 8px}
.block-aula h4:first-child{margin-top:0}
.block-aula ul{padding-left:20px;margin-bottom:12px}
.block-aula ul li{font-family:'Lora',Georgia,serif;font-size:var(--f-sm);color:var(--text2);line-height:1.7;margin-bottom:4px}
.block-aula strong{color:var(--text);font-weight:600}
.block-aula em{color:var(--text3);font-style:italic}
.steps{display:flex;flex-direction:column;gap:8px}
.step{display:flex;gap:16px;align-items:flex-start}
.step-num{width:20px;height:20px;border-radius:50%;background:var(--s3);border:1px solid var(--b2);display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);flex-shrink:0;margin-top:2px}
.step-text{font-family:'Lora',Georgia,serif;font-size:var(--f-sm);color:var(--text2);line-height:1.65}
.criteria{display:flex;flex-direction:column;gap:8px}
.criterion{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;background:var(--s2);border-radius:var(--r)}
.cr-icon{font-size:12px;flex-shrink:0;margin-top:2px}
.cr-text{font-family:'Lora',Georgia,serif;font-size:var(--f-sm);color:var(--text2);line-height:1.55}
.prompt-box{background:var(--s1);border:1px solid var(--b2);border-radius:var(--r);overflow:hidden}
.pb-header{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:var(--s2);border-bottom:1px solid var(--b)}
.pb-label{font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);letter-spacing:.08em;text-transform:uppercase}
.pb-copy{font-family:'DM Mono',monospace;font-size:var(--f-xs);padding:4px 12px;border-radius:var(--r-sm);border:1px solid var(--gold-dim);background:transparent;cursor:pointer;color:var(--gold);transition:background .1s}
.pb-copy:hover{background:var(--gold-bg)}
.pb-copy.copied{color:var(--teal);border-color:var(--teal)}
.pb-content{padding:20px;font-family:'DM Mono',monospace;font-size:var(--f-xs);color:var(--text);line-height:1.75;white-space:pre-wrap}
.gen-box{background:var(--s2);border:1px solid var(--b);border-radius:var(--r);padding:20px}
.gen-box p{font-family:'Lora',Georgia,serif;font-size:var(--f-sm);color:var(--text2);line-height:1.7;margin-bottom:8px}
.gen-box p:last-child{margin-bottom:0}
.gen-box ul{padding-left:20px}
.gen-box ul li{font-family:'Lora',Georgia,serif;font-size:var(--f-sm);color:var(--text2);line-height:1.65;margin-bottom:4px}
.example-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ex-card{border-radius:var(--r);padding:16px;border:1px solid}
.ex-bad{background:rgba(201,64,64,.04);border-color:rgba(201,64,64,.12)}
.ex-good{background:rgba(58,153,114,.04);border-color:rgba(58,153,114,.12)}
.ex-tag{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.08em;font-weight:500;text-transform:uppercase;margin-bottom:8px;display:block}
.ex-bad .ex-tag{color:var(--red)}
.ex-good .ex-tag{color:var(--teal)}
.ex-text{font-family:'Lora',Georgia,serif;font-size:var(--f-xs);color:var(--text2);line-height:1.65;font-style:italic}
.ex-why{font-family:'Lora',Georgia,serif;font-size:var(--f-xs);color:var(--text3);line-height:1.5;margin-top:8px}
.error-box{background:rgba(201,64,64,.04);border:1px solid rgba(201,64,64,.12);border-radius:var(--r);padding:12px 16px;display:flex;gap:12px;align-items:flex-start}
.error-icon{font-size:14px;flex-shrink:0;margin-top:1px}
.error-text{font-family:'Lora',Georgia,serif;font-size:var(--f-sm);color:var(--text2);line-height:1.65}
.checklist{display:flex;flex-direction:column;gap:2px}
.cl-item{display:flex;align-items:flex-start;gap:12px;padding:8px 12px;border-radius:var(--r);cursor:pointer;transition:background .1s;user-select:none}
.cl-item:hover{background:var(--s2)}
.cl-box{width:16px;height:16px;border-radius:3px;border:1px solid var(--b3);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:10px;color:transparent;transition:background .12s,border-color .12s}
.cl-item.done .cl-box{background:var(--teal);border-color:var(--teal);color:var(--bg)}
.cl-text{font-family:'Lora',Georgia,serif;font-size:var(--f-sm);color:var(--text2);line-height:1.5}
.cl-item.done .cl-text{color:var(--text4);text-decoration:line-through}
.time-badge{display:inline-flex;align-items:center;gap:8px;padding:3px 8px;background:var(--s2);border:1px solid var(--b);border-radius:var(--r-sm);font-family:'DM Mono',monospace;font-size:var(--f-xs);color:var(--text3)}
.gate-header{background:rgba(201,64,64,.03);border-left:2px solid var(--red)!important}
.gate-header .mh-title{color:var(--red)}
.gate2-header{background:rgba(74,136,204,.03);border-left:2px solid var(--blue)!important}
.gate2-header .mh-title{color:var(--blue)}
.mod-intro{padding:24px 40px;border-bottom:1px solid var(--b)}
.mi-text{font-family:'Lora',Georgia,serif;font-style:italic;font-size:var(--f-md);color:var(--text2);line-height:1.75;max-width:600px}
.response-area{margin-top:24px;border:1px solid var(--b);border-radius:var(--r);overflow:hidden}
.ra-header{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:var(--s1);border-bottom:1px solid var(--b)}
.ra-label{font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);letter-spacing:.06em;text-transform:uppercase}
.ra-actions{display:flex;gap:4px}
.ra-btn{font-family:'DM Mono',monospace;font-size:var(--f-xs);padding:3px 9px;border-radius:var(--r-sm);border:1px solid var(--b2);background:transparent;cursor:pointer;color:var(--text3);transition:background .1s,color .1s}
.ra-btn:hover{background:var(--s3);color:var(--text)}
.ra-btn.primary{border-color:var(--gold-dim);color:var(--gold);font-weight:500}
.ra-btn.primary:hover{background:var(--gold-bg)}
.ra-btn.copied{border-color:var(--teal);color:var(--teal)}
textarea.ra-input{width:100%;min-height:120px;background:var(--bg);border:none;padding:16px;font-family:'DM Mono',monospace;font-size:var(--f-xs);color:var(--text2);line-height:1.65;resize:vertical;outline:none}
textarea.ra-input::placeholder{color:var(--text4)}
.ra-hint{padding:4px 16px 8px;font-family:'DM Mono',monospace;font-size:10px;color:var(--text4);letter-spacing:.03em}
.lesson-nav{display:flex;justify-content:space-between;padding:20px 0 8px}
.ln-btn{font-family:'DM Mono',monospace;font-size:var(--f-xs);padding:5px 16px;background:transparent;border:1px solid var(--b2);border-radius:var(--r-sm);color:var(--text3);cursor:pointer;transition:all .1s;letter-spacing:.03em}
.ln-btn:hover{background:var(--s2);color:var(--text);border-color:var(--b3)}
.welcome-wrap{max-width:640px;margin:0 auto;padding:48px 32px 80px}
.welcome-eyebrow{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.15em;color:var(--text3);text-transform:uppercase;margin-bottom:16px}
.welcome-title{font-size:var(--f-3xl);font-weight:600;color:var(--text);letter-spacing:-.03em;line-height:1.05;margin-bottom:8px}
.welcome-title span{color:var(--gold)}
.welcome-sub{font-family:'Lora',Georgia,serif;font-style:italic;font-size:var(--f-md);color:var(--text3);margin-bottom:40px;line-height:1.6}
.welcome-section{margin-bottom:40px}
.welcome-section-label{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.1em;color:var(--text4);text-transform:uppercase;margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid var(--b)}
.welcome-how{background:var(--s2);border:1px solid var(--b);border-radius:var(--r);padding:24px;margin-bottom:16px}
.welcome-how p{font-family:'Lora',Georgia,serif;font-size:var(--f-md);color:var(--text2);line-height:1.75;margin-bottom:12px}
.welcome-how p:last-child{margin-bottom:0}
.welcome-how strong{color:var(--text)}
.welcome-steps{display:flex;flex-direction:column;gap:8px}
.welcome-step{display:flex;align-items:flex-start;gap:16px;padding:16px;background:var(--s1);border:1px solid var(--b);border-radius:var(--r)}
.ws-num{width:22px;height:22px;border-radius:50%;background:var(--s3);border:1px solid var(--b2);display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);flex-shrink:0}
.ws-title{font-size:var(--f-sm);font-weight:500;color:var(--text);margin-bottom:2px}
.ws-desc{font-size:var(--f-xs);color:var(--text3);line-height:1.5}
.welcome-agents{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wa-card{background:var(--s1);border:1px solid var(--b);border-radius:var(--r);padding:16px}
.wa-name{font-size:var(--f-md);font-weight:500;letter-spacing:-.01em;margin-bottom:2px}
.wa-mod{font-family:'DM Mono',monospace;font-size:10px;color:var(--text4);margin-bottom:8px;letter-spacing:.03em}
.wa-desc{font-family:'Lora',Georgia,serif;font-size:var(--f-xs);color:var(--text3);line-height:1.5}
.wa-seq{grid-column:1/-1;background:var(--s2)}
.welcome-cta{display:inline-flex;align-items:center;gap:12px;padding:10px 24px;background:var(--gold);color:#0A0A0A;font-family:'DM Mono',monospace;font-size:var(--f-xs);font-weight:500;letter-spacing:.08em;border:none;border-radius:var(--r);cursor:pointer;text-transform:uppercase;transition:opacity .15s}
.welcome-cta:hover{opacity:.85}
.arq-wrap{max-width:900px;margin:0 auto;padding:0 0 80px}
.arq-header{text-align:center;padding:48px 0 40px}
.arq-ey{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.18em;color:var(--text3);text-transform:uppercase;margin-bottom:16px}

<body>

     LOGIN
════════════════════════════════════════════════════════ -->

<div id="login">
  <div class="lg-logo">TEMPLO OZAKA™</div>

<!-- ═══════════════════════════════════════════════════════
     APP
════════════════════════════════════════════════════════ -->

<div id="app">
  <div class="topbar">
    <div class="tb-brand">POS OPS <span>2.0</span></div>
    <div class="tb-tabs">
      <div class="tb-tab active" id="btn-inicio" onclick="switchTab('inicio',this)"><svg width="13" height="13" viewBox="0 0 13 13" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="1" y="1" width="4.5" height="4.5" rx="1" stroke="currentColor" stroke-width="1.2"/><rect x="7.5" y="1" width="4.5" height="4.5" rx="1" stroke="currentColor" stroke-width="1.2"/><rect x="1" y="7.5" width="4.5" height="4.5" rx="1" stroke="currentColor" stroke-width="1.2"/><rect x="7.5" y="7.5" width="4.5" height="4.5" rx="1" stroke="currentColor" stroke-width="1.2"/></svg>Início</div>
      <div class="tb-tab" id="btn-arq" onclick="switchTab('arq',this)"><svg width="13" height="13" viewBox="0 0 13 13" fill="none"><circle cx="6.5" cy="6.5" r="2.2" stroke="currentColor" stroke-width="1.2"/><path d="M6.5 1v1.8M6.5 10.2V12M1 6.5h1.8M10.2 6.5H12" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>Arquitetura</div>
      <div class="tb-tab" id="btn-ap" onclick="switchTab('ap',this)"><svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M2 1.5h6l3 3v7H2v-10z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><path d="M8 1.5V4.5h3M3.5 6h5M3.5 8.5h5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>Apostila</div>
      <div class="tb-tab" id="btn-scripts" onclick="switchTab('scripts',this)"><svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M1 4h11M1 6.5h7M1 9h4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>Scripts M8</div>
      <div class="tb-tab" id="btn-arsenal" onclick="switchTab('arsenal',this)"><svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M6.5 1L8 5H12L8.5 7.5L10 12L6.5 9.5L3 12L4.5 7.5L1 5H5L6.5 1Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>Arsenal</div>
    </div>
    <div class="tb-right" style="display:flex;align-items:center;gap:10px">
      <button onclick="openSearch()" style="font-family:DM Mono,monospace;font-size:10px;color:var(--text-dim);padding:4px 10px;border:1px solid var(--border);border-radius:var(--r);background:transparent;cursor:pointer;transition:all .2s" onmouseover="this.style.color='var(--text)'" onmouseout="this.style.color='var(--text-dim)'">🔍 Buscar (⌘K)</button>
      <button onclick="document.getElementById('apiKeyBanner').style.display=document.getElementById('apiKeyBanner').style.display==='flex'?'none':'flex'" style="font-family:DM Mono,monospace;font-size:10px;color:var(--text4);padding:4px 10px;border:1px solid var(--border);border-radius:var(--r);background:transparent;cursor:pointer;transition:all .2s" onmouseover="this.style.color='var(--gold)'" onmouseout="this.style.color='var(--text4)'">⬡ API</button>
    </div>
  </div>
  <div id="apiKeyBanner" style="display:none;align-items:center;gap:12px;padding:10px 24px;background:rgba(184,146,42,.08);border-bottom:1px solid rgba(184,146,42,.2);flex-shrink:0">
    <span style="font-family:DM Mono,monospace;font-size:11px;color:var(--gold);letter-spacing:.06em">⬡ CONECTAR IA</span>
    <span style="font-family:Lora,serif;font-size:12px;color:var(--text2)">Cole sua API Key da Anthropic para ativar os agentes:</span>
    <input id="apiKeyInput" type="password" placeholder="sk-ant-..." style="flex:1;max-width:340px;background:var(--s2);border:1px solid var(--b2);border-radius:4px;padding:6px 10px;font-family:DM Mono,monospace;font-size:11px;color:var(--text);outline:none" />
    <button onclick="var k=document.getElementById('apiKeyInput').value.trim();if(k){setApiKey(k);document.getElementById('apiKeyBanner').style.display='none';document.getElementById('apiKeyStatus').textContent='IA conectada';document.getElementById('apiKeyStatus').style.color='var(--teal)';}" style="padding:6px 14px;background:var(--gold);color:#07070A;border:none;border-radius:4px;font-family:DM Mono,monospace;font-size:10px;font-weight:500;cursor:pointer;letter-spacing:.06em">Salvar</button>
    <span id="apiKeyStatus" style="font-family:DM Mono,monospace;font-size:10px;color:var(--text4)"></span>
  </div>
  <div class="content">
    <div id="tab-inicio" style="overflow-y:auto;height:100%;padding:48px;display:block"></div>
    <div id="tab-arq" style="overflow-y:auto;height:100%;padding:40px 48px 80px;display:none"></div>
    <div id="tab-ap" style="display:none;width:100%;height:100%">
      <!-- SIDEBAR -->
      <div class="ap-sidebar" id="sidebar"></div>
      <!-- MAIN -->
      <div class="ap-main" id="apMain"></div>
    </div>
    <div id="tab-scripts" style="width:100%;height:100%;overflow-y:auto;padding:32px 40px 80px;display:none"></div>
    <div id="tab-arsenal" style="width:100%;height:100%;display:none"></div>
  </div>
</div>

<script>
// ──────────────────────────────────────────────────────────
// PIN LOGIN
// ──────────────────────────────────────────────────────────
const CORRECT = '1172';
const pins = [0,1,2,3].map(i => document.getElementById('p'+i));
const msg = document.getElementById('lgMsg');

pins.forEach((inp, i) => {
  inp.addEventListener('input', e => {
    const v = e.target.value.replace(/\D/g,'');
    e.target.value = v;
    if(v) { inp.classList.add('filled'); if(i<3) pins[i+1].focus(); }
    else inp.classList.remove('filled');
    const full = pins.map(p=>p.value).join('');
    if(full.length===4) checkPin(full);
  });
  inp.addEventListener('keydown', e => {
    if(e.key==='Backspace' && !inp.value && i>0) pins[i-1].focus();
  });
});

// ── API KEY ──
function getApiKey(){
  try{return localStorage.getItem('pos_api_key')||'';}catch(e){return '';}
}
function setApiKey(k){
  try{localStorage.setItem('pos_api_key',k);}catch(e){}
}
function promptApiKey(){
  var k=getApiKey();
  if(k) return k;
  var el=document.getElementById('apiKeyInput');
  if(el&&el.value.trim()){
    setApiKey(el.value.trim());
    return el.value.trim();
  }
  return '';
}

function checkPin(val){
  if(val===CORRECT){
    document.getElementById('login').style.opacity='0';
    document.getElementById('login').style.transition='opacity .4s ease';
    setTimeout(()=>{
      document.getElementById('login').style.display='none';
      const app=document.getElementById('app');
      app.style.display='flex';
      // Show API key setup if not set
      if(!getApiKey()) document.getElementById('apiKeyBanner').style.display='flex';
    },400);
  } else {
    msg.textContent='Código inválido. Tente novamente.';
    document.getElementById('pinWrap').classList.add('shake');
    setTimeout(()=>{
      document.getElementById('pinWrap').classList.remove('shake');
      pins.forEach(p=>{p.value='';p.classList.remove('filled')});
      pins[0].focus();
      setTimeout(()=>msg.textContent='',2000);
    },300);
  }
}

// ── SEARCH INDEX ──
function buildSearchIndex(){
  window._searchIndex=window._searchIndex||[];
  window._searchIndex=[];
  if(typeof MODULES==='undefined')return;
  MODULES.forEach(function(mod){
    mod.lessons.forEach(function(l,li){
      var text=(l.title+' '+l.intro+' '+l.prompt+' '+l.erroCom+' '+l.exGood).toLowerCase();
      window._searchIndex.push({modId:mod.id,modLabel:mod.label,li:li,title:l.title,num:l.num,text:text,preview:l.intro.substring(0,90)+'...'});
    });
  });
}
function doSearch(q){
  var res=document.getElementById('searchResults');
  if(!q||q.length<2){res.innerHTML='';return;}
  var idx=window._searchIndex||[];
  var m=idx.filter(function(i){return i.text.indexOf(q.toLowerCase())>=0;}).slice(0,10);
  if(!m.length){res.innerHTML='<div style="padding:16px;text-align:center;font-family:DM Mono,monospace;font-size:11px;color:#3E3D3A">Nenhum resultado</div>';return;}
  res.innerHTML=m.map(function(i){return '<div onclick="goToLesson(\''+i.modId+'\','+i.li+')" style="padding:11px 14px;border-bottom:1px solid rgba(255,255,255,.07);cursor:pointer" onmouseover="this.style.background=\'#16161B\'" onmouseout="this.style.background=\'transparent\'"><div style="font-family:DM Mono,monospace;font-size:11px;color:#B8922A;letter-spacing:.08em;margin-bottom:3px;text-transform:uppercase">'+i.modLabel+' · '+i.num+'</div><div style="font-family:Lora,serif;font-size:12px;color:#E4E2DA;margin-bottom:2px">'+i.title+'</div><div style="font-family:Lora,serif;font-size:11px;color:#9A9890">'+i.preview+'</div></div>';}).join('');
}

document.addEventListener('DOMContentLoaded',()=>{ pins[0].focus(); buildWelcome(); buildArq(); buildApostila(); buildScripts(); buildArsenal(); setTimeout(buildSearchIndex, 500); });

// ──────────────────────────────────────────────────────────
// TAB SWITCHING
// ──────────────────────────────────────────────────────────
function switchTab(id,el){
  document.querySelectorAll('.tb-tab').forEach(function(t){t.classList.remove('active');});
  el.classList.add('active');
  ['inicio','arq','ap','scripts','arsenal'].forEach(function(t){
    var d=document.getElementById('tab-'+t);
    if(d) d.style.display=(t===id)?(t==='ap'?'flex':'block'):'none';
  });
}

// ──────────────────────────────────────────────────────────
// COPY PROMPT
// ──────────────────────────────────────────────────────────
function copyPrompt(btn){
  const text = btn.closest('.prompt-box').querySelector('.pb-content').textContent;
  navigator.clipboard.writeText(text).then(()=>{
    btn.textContent='✓ Copiado';
    btn.classList.add('copied');
    setTimeout(()=>{ btn.textContent='Copiar'; btn.classList.remove('copied'); },2000);
  });
}
function copyTxt(btn,text){
  var was=btn.textContent;
  function done(){btn.textContent='✓ Copiado';btn.classList.add('copied');setTimeout(function(){btn.textContent=was;btn.classList.remove('copied');},2000);}
  if(navigator.clipboard){navigator.clipboard.writeText(text).then(done).catch(function(){var t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(t);done();});}
  else{var t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(t);done();}
}


// ──────────────────────────────────────────────────────────
// CHECKLIST
// ──────────────────────────────────────────────────────────
function toggleCheck(el){
  el.classList.toggle('done');
  var key=el.getAttribute('data-cl-key');
  if(key) saveCL(key,el.classList.contains('done'));
  var li=el.closest('.lesson-item');
  if(li){
    var all=li.querySelectorAll('.cl-item');
    var done=li.querySelectorAll('.cl-item.done');
    if(all.length>0&&all.length===done.length) li.classList.add('done-state');
    else li.classList.remove('done-state');
  }
}

// ──────────────────────────────────────────────────────────
// LESSON ACCORDION
// ──────────────────────────────────────────────────────────
function toggleLesson(el){
  const item = el.closest('.lesson-item');
  item.classList.toggle('open');
}

// SIDEBAR NAV
// ──────────────────────────────────────────────────────────
function navTo(id){
  document.querySelectorAll('.sb-item').forEach(i=>i.classList.remove('active'));
  document.querySelectorAll('[data-sb="'+id+'"]').forEach(i=>i.classList.add('active'));
  renderModule(id);
}

// HELPERS
// ──────────────────────────────────────────────────────────
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html)e.innerHTML=html;return e;}
function blockLabel(txt){return `<div class="block-label">${txt}</div>`;}
function promptBox(text){return `<div class="prompt-box"><div class="pb-header"><span class="pb-label">PROMPT EXATO — COPIE E COLE NO GPT</span><button class="pb-copy" onclick="copyPrompt(this)">Copiar</button></div><div class="pb-content">${text}</div></div>`;}
function timeB(t){return `<span class="time-badge"><span class="tb-icon">⏱</span> ${t}</span>`;}
function checklist(items,modId,li){
  var out='<div class="checklist">';
  for(var ci=0;ci<items.length;ci++){
    var key=(modId||'x')+'_'+(li===undefined?0:li)+'_'+ci;
    var done=loadCL(key);
    out+='<div class="cl-item'+(done?' done':'')+'" data-cl-key="'+key+'" onclick="toggleCheck(this)">';
    out+='<div class="cl-box">✓</div><div class="cl-text">'+items[ci]+'</div></div>';
  }
  out+='</div>';
  return out;
}
function steps(items){return `<div class="steps">${items.map((s,i)=>`<div class="step"><div class="step-num">${i+1}</div><div class="step-text">${s}</div></div>`).join('')}</div>`;}
function criteria(items){return `<div class="criteria">${items.map(([icon,t])=>`<div class="criterion"><span class="cr-icon">${icon}</span><div class="cr-text">${t}</div></div>`).join('')}</div>`;}
function exGoodBad(bad,badWhy,good,goodWhy){return `<div class="example-grid"><div class="ex-card ex-bad"><span class="ex-tag">✗ RESPOSTA RASA</span><div class="ex-text">${bad}</div><div class="ex-why">${badWhy}</div></div><div class="ex-card ex-good"><span class="ex-tag">✓ RESPOSTA COM ESTRUTURA</span><div class="ex-text">${good}</div><div class="ex-why">${goodWhy}</div></div></div>`;}
function errorBox(txt){return `<div class="error-box"><span class="error-icon">⚠</span><div class="error-text">${txt}</div></div>`;}
function genBox(html){return `<div class="gen-box">${html}</div>`;}

{
  id:'m2',label:'M02',name:'ICP + Aderência',
  agent:'Kenji',agentBadge:'badge-k',
  color:'#3DA882',tagBg:'var(--teal-d)',tagColor:'var(--teal)',
  semana:'8 aulas · Sem 1-2',isGate:false,
  aulas:8,
  desc:`Mapeia o comprador real com JTBD, 5 estágios de consciência e 4 tipologias de guerreiro.`,intro:`Agora que você sabe quem é, vamos entender para quem você faz sentido. Não o cliente que você gostaria de ter — o cliente que já comprou ou que tem tudo para comprar.`,
  lessons:[{
  num:'2.1',title:'Quem é o seu ICP real — JTBD e o trabalho que contrata',time:'45-60 min',
  intro:`A maioria dos operadores descreve o ICP como uma lista de características demográficas. O Kenji trabalha diferente. Aqui o ICP é definido pelo trabalho que ele está tentando realizar — e pela dor que sente quando não consegue. Jobs To Be Done (JTBD) é a metodologia que revela isso com precisão.`,aula:`<h4>Por que JTBD muda tudo</h4>
<p>O conceito de Jobs To Be Done (Bob Moesta / Clayton Christensen) parte de uma premissa simples mas poderosa: as pessoas não compram produtos — elas contratam soluções para realizar um trabalho que precisa ser feito.</p>
<p>O "trabalho" tem três dimensões inseparáveis:</p>
<p><strong>Funcional:</strong> o que precisa acontecer no mundo real. "Quero ter um posicionamento claro para parar de perder vendas por objeção de preço."</p>
<p><strong>Emocional:</strong> como a pessoa quer se sentir depois. "Quero me sentir confiante quando apresento minha oferta, não ansioso."</p>
<p><strong>Social:</strong> como quer ser percebida pelos outros. "Quero ser percebido como especialista, não como mais um coach no mercado."</p>
<p>O erro clássico é focar só no funcional. Mas a decisão de compra é majoritariamente emocional e social — o racional vem depois para justificar. Se sua mensagem fala só de resultado prático, está perdendo os dois drivers principais de compra.</p>`,
  oQueFazer:[`Pense nos 3 clientes mais satisfeitos que você já teve`,`Para cada um: o que eles estavam tentando realizar quando te contrataram? (não o que disseram — o que o problema revelava)`,`Identifique as 3 dimensões do trabalho para cada cliente: funcional, emocional, social`,`Procure o padrão: o que os 3 tinham em comum no trabalho que estavam contratando?`,`Formule o trabalho central em 1 frase com o formato abaixo`],comoFazer:[[`▸`,`O trabalho precisa ter as 3 dimensões. Se só tem a funcional, está incompleto.`],[`▸`,`Formato: "Meu ICP contrata para realizar [progresso funcional] e se sentir [estado emocional], sendo percebido como [estado social]."`]],
  prompt:`Estou no M2, aula 2.1 — identificação do ICP real com JTBD.

Meus 3 clientes mais satisfeitos:
Cliente 1: [perfil e o que os levou a te contratar]
Cliente 2: [perfil e motivação]
Cliente 3: [perfil e motivação]

Para cada cliente, identifique as 3 dimensões do trabalho (funcional, emocional, social). Depois, encontre o padrão comum e me ajude a formular o trabalho central em 1 frase.

Seja rigoroso com a dimensão emocional e social — a maioria esquece essas duas.`,instrucoes:`<p>O Kenji vai aprofundar as 3 dimensões de cada cliente. Preste especial atenção às dimensões emocional e social — onde mora a maior potência da mensagem.</p><ul><li>Output: trabalho central formulado nas 3 dimensões</li><li>Cole no Docs Mestre — seção M2, bloco ICP</li></ul>`,
  exBad:`Meu ICP são empreendedores que querem crescer e ter mais clientes.`,exBadWhy:`Sem dimensão emocional, sem social, sem especificidade. "Empreendedores que querem crescer" é 80% da população que tem negócio.`,
  exGood:`Meu ICP contrata para estruturar o sistema comercial (funcional) e se sentir no controle do negócio em vez de dependente do humor do mercado (emocional), sendo percebido pelos sócios como quem tem visão estratégica, não só execução (social).`,exGoodWhy:`3 dimensões claras, progressos específicos, linguagem que o ICP reconheceria como sua.`,
  erroCom:`Descrever o trabalho com linguagem do operador em vez da linguagem do cliente. "Construir posicionamento de autoridade" é linguagem de consultor. "Parar de perder venda por preço antes de explicar o que faz" é linguagem de cliente.`,check:[`3 clientes satisfeitos mapeados com contexto`,`Trabalho central formulado nas 3 dimensões`,`Linguagem do cliente usada (não linguagem do operador)`,`Output colado no Docs Mestre — bloco ICP`]
},
{
  num:'2.2',title:'Dor ativa, urgência e o que separa comprador de curioso',time:'40-55 min',
  intro:`Nem toda dor compra. Existe dor crônica — que o cliente convive há anos — e dor ativa — que está produzindo custo visível agora. Só a dor ativa tem urgência de compra. Esta aula aprende a distinguir as duas e identificar os sinais de quem está pronto para comprar.`,aula:`<h4>O que faz uma dor virar compra</h4>
<p>Dor ativa tem três marcadores:</p>
<p><strong>Custo visível:</strong> está produzindo perda mensurável agora — de dinheiro, tempo ou oportunidade. O cliente consegue quantificar.</p>
<p><strong>Tentativa recente:</strong> ele já tentou resolver nos últimos 90 dias. Pesquisou, testou, contratou alguém. Isso mostra que a dor passou do nível de tolerância.</p>
<p><strong>Pressão de prazo:</strong> existe algo que torna o problema mais urgente agora do que 6 meses atrás.</p>
<p>O Mom Test (Rob Fitzpatrick) ensina que as pessoas são naturalmente gentis — elas tendem a validar qualquer ideia para não parecer rudes. Por isso, perguntar "você compraria isso?" não funciona. O que funciona é observar comportamento e história real.</p>
<p>ICP com dor ativa não precisa ser convencido de que tem um problema. Só precisa ser convencido de que você é a solução certa. ICP com dor crônica precisa ser convencido de que o problema merece atenção — o que é muito mais difícil e caro em energia.</p>`,
  oQueFazer:[`Pense nos clientes que compraram mais rápido (menos de 2 semanas do primeiro contato ao pagamento)`,`O que eles tinham em comum que os tornava urgentes?`,`Identifique os 3 marcadores de dor ativa para o seu ICP`,`Identifique 5 frases que o cliente com dor ativa diz (palavras exatas)`,`Identifique 5 frases que o cliente com dor crônica diz (palavras de tolerância)`],comoFazer:[[`▸`,`Urgência real se revela em comportamento, não em afirmação. "Preciso muito resolver isso" sem tentativa recente é dor crônica com linguagem de dor ativa.`],[`▸`,`As frases exatas que o cliente usa são ouro — são o que vai entrar no script de DM do M8 e no lead do M7.`]],
  prompt:`Estou no M2, aula 2.2 — mapeando dor ativa vs. dor crônica.

Clientes que compraram rápido (características em comum): [descreva]
O que os tornava urgentes: [descreva]

Me ajude a:
1. Identificar os 3 marcadores de dor ativa específicos para o meu ICP
2. Listar 5 frases que o cliente com dor ativa diz (palavras exatas)
3. Listar 5 frases que o cliente com dor crônica diz (palavras de tolerância)
4. Definir o que diferencia quem vai comprar de quem vai só pedir informação`,instrucoes:`<p>Foque nas frases exatas. Elas vão aparecer novamente no M7 (tipo de lead) e no M8 (script de triagem).</p>`,
  exBad:`Meu ICP tem dor com falta de clareza no posicionamento.`,exBadWhy:`Dor genérica, sem marcadores de urgência, sem frases do cliente, sem diferenciador entre crônico e ativo.`,
  exGood:`DOR ATIVA: perdeu uma venda grande por objeção de preço na última semana (custo visível), já tentou reformular a proposta sozinho (tentativa recente), tem reunião com sócio para justificar a carteira fraca (pressão). Frases: "Tô perdendo cliente para concorrente mais barato", "Não sei como justificar meu preço", "Preciso resolver isso antes do trimestre fechar".`,exGoodWhy:`3 marcadores específicos, frases no idioma do cliente, contexto de urgência claro. Permite triagem em 2 perguntas.`,
  erroCom:`Confundir interesse com urgência. Cliente interessado lê seus posts. Cliente com dor ativa pergunta sobre como funciona, prazo e preço — nessa ordem.`,check:[`3 marcadores de dor ativa identificados`,`5 frases de dor ativa listadas (palavras exatas)`,`5 frases de dor crônica listadas`,`Critério de diferenciação documentado`,`Output colado no Docs Mestre`]
},
{
  num:'2.3',title:'Os 5 estágios de consciência de Schwartz',time:'50-70 min',
  intro:`Eugene Schwartz identificou que o estado mental do comprador no momento em que recebe a mensagem determina tudo — o tipo de lead que funciona, o que precisa ser dito antes do CTA, o tom da comunicação. Esta aula mapeia em qual estágio o seu ICP está.`,aula:`<h4>Os 5 estágios e o que cada um exige</h4>
<p><strong>Estágio 1 — Most Aware:</strong> já conhece você e está pronto para comprar. Mensagem: oferta direta. Lead: Oferta.</p>
<p><strong>Estágio 2 — Product Aware:</strong> conhece soluções similares, está comparando. Mensagem: diferenciação por mecanismo. Lead: Promessa.</p>
<p><strong>Estágio 3 — Solution Aware:</strong> sabe que existe solução mas não te conhece. Mensagem: apresentar solução + mecanismo. Lead: Solução-Problema.</p>
<p><strong>Estágio 4 — Problem Aware:</strong> sente a dor mas não sabe que existe solução. Mensagem: validar a dor, revelar que existe saída, apresentar mecanismo. Lead: Segredo-Revelação.</p>
<p><strong>Estágio 5 — Unaware:</strong> não sabe que tem o problema. Mensagem: começa de um lugar completamente diferente — geralmente história. Lead: História.</p>
<p>O erro mais comum: operar no Estágio 3 com mensagem de Estágio 1. O cliente não está pronto para a oferta direta porque nem sabe que você existe.</p>`,
  oQueFazer:[`Reveja o trabalho central mapeado na 2.1`,`Faça as 3 perguntas de diagnóstico: (1) ICP está ativamente procurando solução? (2) Te conhece? (3) Sabe que o problema é solucionável?`,`Baseado nas respostas, identifique o estágio`,`Identifique as implicações para M7 (qual tipo de lead vai funcionar)`],comoFazer:[[`▸`,`Um ICP pode estar em estágios diferentes dependendo do canal. Quem te segue há 6 meses pode estar no Estágio 2. Quem nunca ouviu falar de você está no 3 ou 4.`],[`▸`,`Não confunda onde você quer que o ICP esteja com onde ele está.`]],
  prompt:`Estou no M2, aula 2.3 — mapeando o estágio de consciência.

Meu ICP e problema central (das aulas anteriores): [cole]

Me ajude a diagnosticar o estágio com as 3 perguntas:
1. Meu ICP está ativamente buscando solução para este problema agora?
2. Ele me conhece (ou conhece operadores similares)?
3. Ele sabe que o problema é solucionável?

Qual estágio é o primário? Quais as implicações para o tipo de lead no M7?`,instrucoes:`<p>Output: estágio identificado + tipo de lead correspondente. Este dado vai direto para o M7.</p>`,
  exBad:`Acho que meu ICP está no estágio 2 ou 3.`,exBadWhy:`Sem as 3 perguntas respondidas com evidência, o estágio é suposição.`,
  exGood:`DIAGNÓSTICO: Estágio 3. ICP sabe que existe solução (já viu outros consultores, já tentou cursos), mas não me conhece. Implicação M7: lead de Solução-Problema. Preciso mostrar que entendo o problema melhor do que ele, só então apresentar como resolvo.`,exGoodWhy:`Diagnóstico com critério explícito, evidência, implicação direta.`,
  erroCom:`Assumir que o ICP está em estágio mais avançado porque você tem muitos seguidores. Seguidor não é comprador em processo de decisão.`,check:[`3 perguntas de diagnóstico respondidas`,`Estágio primário definido com justificativa`,`Tipo de lead para M7 documentado`,`Output colado no Docs Mestre`]
},
{
  num:'2.4',title:'As 4 tipologias de guerreiro do comprador',time:'35-50 min',
  intro:`O estágio de consciência diz o que o ICP sabe. A tipologia diz como ele age — o padrão de comportamento que determina como ele compra, o que o trava, e como a oferta precisa ser apresentada.`,aula:`<h4>Os 4 padrões</h4>
<p><strong>EXECUTOR:</strong> sabe o que quer fazer mas não age. Quer estrutura e sistema. Trava com: "e se não funcionar para o meu caso?" Resposta: cases de perfis similares.</p>
<p><strong>OBSERVADOR:</strong> analisa demais, decide tarde. Quer certeza antes de comprometer. Trava com: "ainda não tenho certeza suficiente." Resposta: lógica de causa e efeito + prazo.</p>
<p><strong>FORJADOR:</strong> alta energia, pouco foco. Quer estrutura que transforma esforço em resultado. Trava com: "tenho tantas coisas ao mesmo tempo." Resposta: o sistema elimina o excesso.</p>
<p><strong>PORTADOR DO VAZIO:</strong> sente que tem algo grande mas não nomeia. Quer linguagem para o que sente. Trava com: medo de que, nomeado, não seja suficientemente especial. Resposta: você não vai inventar — vai revelar o que já existe.</p>`,
  oQueFazer:[`Reveja os 3 clientes da aula 2.1 — qual era o comportamento de compra de cada um?`,`Identifice a tipologia dominante de cada um`,`Qual tipologia aparece mais entre seus melhores clientes?`,`Identifique o travamento central da tipologia dominante`],comoFazer:[[`▸`,`Um cliente pode ter características de mais de uma tipologia. Identifique a DOMINANTE.`],[`▸`,`As objeções de venda revelam a tipologia: "preciso pensar mais" = OBSERVADOR. "Não tenho tempo" = FORJADOR.`]],
  prompt:`Estou no M2, aula 2.4 — identificando a tipologia de guerreiro.

Comportamento de compra dos meus 3 melhores clientes:
Cliente 1: [como comprou — rápido/lento, perguntas, o que desbloqueou]
Cliente 2: [como comprou]
Cliente 3: [como comprou]

Objeções mais comuns nas minhas conversas: [liste as 3 principais]

Identifique: (1) tipologia dominante de cada cliente, (2) padrão dominante do ICP, (3) travamento central a endereçar.`,instrucoes:`<p>As objeções que você recebe revelam a tipologia com mais clareza do que qualquer dado.</p>`,
  exBad:`Meu ICP é do tipo que precisa de motivação para agir.`,exBadWhy:`Não é tipologia — é percepção genérica. Não permite construir script diferenciado.`,
  exGood:`TIPOLOGIA DOMINANTE: OBSERVADOR. Meus melhores clientes fizeram muitas perguntas, pediram referências, demoraram 1-3 semanas. Objeção mais comum: "preciso entender melhor como funciona." Travamento: certeza — precisam provar para si mesmos que a decisão é racional. Implicação: oferta precisa ter lógica clara de causa e efeito + cases documentados.`,exGoodWhy:`Tipologia com evidência comportamental, objeção típica, travamento explícito, implicação direta.`,
  erroCom:`Tentar mudar a tipologia do cliente. OBSERVADOR não vira EXECUTOR porque você ficou mais entusiasmado. Adapte a mensagem.`,check:[`Comportamento de compra analisado`,`Tipologia dominante do ICP identificada`,`Travamento central nomeado`,`Implicação para apresentação da oferta`,`Output colado no Docs Mestre`]
},
{
  num:'2.5',title:'Mapeando o não-ICP com critério objetivo',time:'30-45 min',
  intro:`Saber para quem você não trabalha é tão estratégico quanto saber para quem trabalha. O não-ICP não é "cliente difícil" — é um perfil específico com características identificáveis que indicam falta de aderência ao seu mecanismo.`,aula:`<h4>Por que o não-ICP importa</h4>
<p>Operadores que não têm não-ICP bem definido atendem todos que pagam. O resultado é consistentemente o mesmo: entrega mediana, cliente insatisfeito, operador exausto, e referências que atraem mais do mesmo.</p>
<p>Existem 3 tipos de não-ICP:</p>
<p><strong>Não-ICP de contexto:</strong> independente de quão bom seja o cliente, está em um contexto que não permite que o mecanismo funcione.</p>
<p><strong>Não-ICP de mentalidade:</strong> tem uma crença ou comportamento que impede que o trabalho funcione.</p>
<p><strong>Não-ICP de urgência:</strong> tem o problema mas não tem a pressão que cria movimento real.</p>
<p>Cada tipo tem sinais identificáveis em uma conversa de 15 minutos. Identificar cedo poupa semanas de trabalho.</p>`,
  oQueFazer:[`Pense nos 3 casos mais desgastantes ou com menor resultado que você já teve`,`Para cada um: o que tornava o trabalho difícil? Qual característica do cliente ou do contexto?`,`Identifique o tipo de não-ICP (contexto / mentalidade / urgência)`,`Formule 3 critérios de exclusão objetivos — identificáveis em conversa`],comoFazer:[[`▸`,`Critério objetivo não é "é difícil de lidar". É "não tem produto validado com pelo menos 5 clientes pagantes".`],[`▸`,`Os sinais precisam ser identificáveis em conversa. Se você só descobre depois de 3 semanas, o critério está mal formulado.`]],
  prompt:`Estou no M2, aula 2.5 — mapeando o não-ICP.

Meus 3 casos mais desgastantes:
Caso 1: [o que tornava difícil]

{
  num:'2.6',title:'Contexto de mercado — onde o ICP está e como decide',time:'30-40 min',
  intro:`O melhor posicionamento entregue no lugar errado não converte. Esta aula mapeia onde o ICP passa o tempo, o que chama sua atenção e o contexto em que toma decisões de compra.`,aula:`<h4>Contexto de decisão</h4>
<p>Três perguntas determinam onde e como aparecer:</p>
<p><strong>Onde está:</strong> quais plataformas, comunidades, eventos, perfis ele consome. Não onde você acha — onde os clientes que já compraram estavam quando te encontraram.</p>
<p><strong>O que chama sua atenção:</strong> qual tipo de conteúdo ele para para ler, salvar ou compartilhar. Isso revela o formato que vai funcionar nos M6 e M7.</p>
<p><strong>Quando e como decide:</strong> Moesta (Demand-Side Sales) chama de "momento de luta" — o instante em que o cliente decide que a situação atual é inaceitável. Saber quando esse momento acontece permite aparecer na hora certa.</p>`,

{
  num:'2.7',title:'Estágio de consciência — protocolo direto para M7',time:'30-40 min',
  intro:`Esta aula conecta o que foi mapeado com o que será construído no M7. É uma aula de síntese — o output é um protocolo de 3 linhas que o Ryu vai usar como base na narrativa.`,aula:`<h4>O protocolo de 3 linhas</h4>

  num:'2.8',title:'Mapa de Aderência Real — consolidação do M2',time:'60-80 min',
  intro:`Com todos os elementos mapeados, esta aula gera o Mapa de Aderência Real — o documento que o OZAKA vai usar em M3, M4 e M8, e o Ryu vai usar em M7. Ele precisa ter a precisão de um briefing, não a generalidade de um persona de marketing.`,aula:`<h4>O que é o Mapa de Aderência Real</h4>
<p>O Mapa de Aderência Real é o antídoto para o persona de marketing genérico. Sem nome fictício nem foto de stock. Com comportamento observável, linguagem específica do cliente, estágio de consciência e critérios de triagem.</p>

  desc:`Define território, sofisticação de mercado, categoria e renúncias estratégicas.`,intro:`Com o centro travado, você pode finalmente construir para fora. M3 é sobre a pergunta mais estratégica: onde você vai jogar?`,
  lessons:[{
  num:'3.1',title:'Sofisticação de mercado — os 5 estágios de Schwartz',time:'45-60 min',
  intro:`Antes de qualquer decisão de posicionamento, você precisa saber em qual estágio de sofisticação está o seu mercado. Schwartz identificou que mercados evoluem — e a estratégia que funciona no Estágio 1 é suicida no Estágio 5.`,aula:`<h4>Os 5 estágios</h4>
<p><strong>Estágio 1:</strong> mercado virgem. Claim direto funciona.</p>
<p><strong>Estágio 2:</strong> outros com claims similares. Amplie o claim — torne-o mais específico.</p>
<p><strong>Estágio 3:</strong> saturação de claims. Introduza mecanismo novo — "Como o Método X produz Y".</p>
<p><strong>Estágio 4:</strong> mecanismos explorados. Elabore o mecanismo — mais especificidade, mais prova.</p>
<p><strong>Estágio 5:</strong> mercado exausto. Só identificação total funciona — "eu sou você, passei pelo que você passa."</p>
<p>A maioria dos mercados de serviço premium está no Estágio 3-4. Claim direto e método genérico já não diferenciam. O que diferencia é mecanismo específico + prova específica.</p>`,

{
  num:'3.2',title:'Disputar categoria vs. criar categoria — Play Bigger',time:'50-65 min',
  intro:`Esta é a decisão mais estratégica do posicionamento: você vai competir dentro de uma categoria existente ou criar uma nova onde você é o único? A resposta determina tudo — o claim, o mecanismo, o tipo de conteúdo, a conversa de venda.`,aula:`<h4>A lógica de categoria</h4>
<p>O livro Play Bigger (Al Ramadan) argumenta que os maiores negócios não competiram — eles criaram a categoria e se tornaram o rei dela.</p>
<p>Para operadores de serviço:</p>
<p><strong>Disputar categoria existente:</strong> você entra em uma categoria conhecida e se diferencia por mecanismo específico, nicho preciso ou resultado documentado. Mais fácil de comunicar, mais difícil de manter como diferencial de longo prazo.</p>
<p><strong>Criar categoria nova:</strong> você nomeia um problema ou solução que não tinha nome antes, se torna o educador da categoria. Mais difícil no início, exponencialmente mais poderoso quando pega.</p>
<p>Criar categoria não significa inventar algo inexistente. Significa nomear com precisão o que você faz de um jeito que ainda não tinha nome — e que o ICP reconhece como "é exatamente isso que eu precisava."</p>`,
  oQueFazer:[`Reveja o mecanismo do M1 e o ICP do M2`,`Tente nomear o que você faz de forma que ainda não existe com esse nome`,`Teste: o ICP entende sem explicação? (se sim, já existe — está disputando)`,`Se criar categoria: qual é o inimigo? Qual é o rei?`,`Valide com o OZAKA dado o estágio de sofisticação`],comoFazer:[[`▸`,`O nome da categoria nova precisa ter o problema do ICP embutido.`],[`▸`,`O inimigo não é um competidor — é um comportamento ou crença. "Improviso comercial" é um inimigo de categoria.`]],
  prompt:`Estou no M3, aula 3.2 — decisão de disputar vs. criar categoria.

Mecanismo (M1): [cole]
ICP e problema (M2): [cole]
Estágio de sofisticação (3.1): [cole]

},
{
  num:'3.3',title:'Território — onde jogar e onde definitivamente não jogar',time:'40-55 min',
  intro:`Território é a interseção de onde você tem autoridade real, onde o ICP tem problema urgente, e onde o mercado tem espaço para uma voz nova. Fora dessa interseção, você está em campo adversário.`,aula:`<h4>Os 3 componentes</h4>

<p>Território também precisa de renúncia. Definir onde você ESTÁ é também definir onde você NÃO ESTÁ. Sem renúncia, território se torna presença genérica.</p>`,

{
  num:'3.4',title:'Tese principal — o ponto de vista defensável',time:'45-60 min',
  intro:`Posicionamento sem tese é endereço sem opinião. A tese é o ponto de vista específico que você defende — algo que outros não dizem, que você pode provar, e que quando o ICP ouve, pensa: "é exatamente o que eu precisava ouvir".`,aula:`<h4>O que é uma tese</h4>
<p>Tese não é claim. Claim é "eu resolvo X". Tese é "X acontece por Y — e a maioria das soluções falha porque tentam resolver Z sem entender Y".</p>
<p>Uma tese tem 3 componentes:</p>
<p><strong>Uma observação não óbvia:</strong> algo que você viu que a maioria não viu.</p>
<p><strong>Uma causa específica:</strong> por que o problema existe ou persiste.</p>
<p><strong>Uma implicação para a solução:</strong> o que a maioria das abordagens não faz.</p>
<p>Tese fraca: "Posicionamento é importante para cobrar mais."</p>
<p>Tese forte: "Operadores perdem vendas por objeção de preço não porque cobram demais — porque o comprador não consegue distinguir o valor antes de ver o preço. O problema não é o preço — é a sequência da conversa."</p>`,

  desc:`Constrói a oferta pela Equação de Valor de Hormozi: mecanismo, escopo, promessa e preço baseado em valor.`,intro:`Posicionamento sem oferta é manifesto. O M4 conecta os dois — e usa a Equação de Valor de Hormozi para garantir que o preço seja consequência do valor.`,
  lessons:[{
  num:'4.1',title:'A Equação de Valor de Hormozi',time:'45-60 min',
  intro:`Antes de construir a oferta, entenda a matemática que governa a percepção de valor. Hormozi formulou a equação que explica por que dois produtos com o mesmo resultado podem ter preços percebidos completamente diferentes.`,aula:`<h4>Valor = (RD × PP) ÷ (T × E)</h4>
<p><strong>Resultado dos Sonhos (RD):</strong> o que o cliente quer — não o que você entrega, o que ele quer alcançar. Quanto mais próximo do sonho específico, maior o numerador.</p>
<p><strong>Probabilidade Percebida (PP):</strong> a chance que o cliente acredita ter de conseguir. Prova de perfis similares aumenta a PP. Promessa vaga diminui.</p>
<p><strong>Tempo (T):</strong> quanto mais rápido o resultado, maior o valor. "Em 30 dias" vale mais que "eventualmente".</p>
<p><strong>Esforço (E):</strong> quanto o cliente precisa mudar para obter o resultado. Menor esforço = maior valor percebido.</p>

{

  intro:`O problema da oferta é sempre mais estreito do que o do posicionamento. E a transformação precisa ser descrita nos termos do ICP — não nos do operador. Esta aula constrói os dois com especificidade.`,aula:`<h4>Problema específico + Transformação</h4>

  intro:`O mecanismo é o que diferencia sua oferta de qualquer outra que promete resultado similar. O formato é o que o mecanismo exige. O escopo é o que protege a entrega. Esta aula define os três.`,aula:`<h4>Mecanismo → Formato → Escopo</h4>

// ── COPY FOR DOCS MESTRE ──
function copyForDocs(btn,modId,lessonIdx){
  const mod=MODULES.find(m=>m.id===modId);
  if(!mod)return;
  const lesson=mod.lessons[lessonIdx];
  if(!lesson)return;
  const ta=document.querySelector('[data-ta-key="'+modId+'_'+lessonIdx+'"]');
  const taContent=ta?ta.value.trim():'';
  const checks=querySelectorAll('[data-cl-key^="'+modId+'_'+lessonIdx+'_"]');;
  const done=[...checks].filter(c=>c.classList.contains('done')).map(c=>c.querySelector('.cl-text').textContent);
  const pend=[...checks].filter(c=>!c.classList.contains('done')).map(c=>c.querySelector('.cl-text').textContent);
  let out='━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n';
  out+='POSITION OPS 2.0 — DOCS MESTRE\n';
  out+=mod.label+' — '+mod.name+' | '+lesson.num+'\n';
  out+=lesson.title+'\n';
  out+='━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n';
  out+=(taContent||'[Cole aqui o output gerado pelo GPT após a sessão]')+'\n\n';
  if(done.length){out+='CONCLUÍDO:\n';done.forEach(i=>out+='✓ '+i+'\n');out+='\n';}
  if(pend.length){out+='PENDENTE:\n';pend.forEach(i=>out+='☐ '+i+'\n');out+='\n';}
  out+='━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n';
  navigator.clipboard.writeText(out).then(()=>{
    const was=btn.textContent;btn.textContent='✓ Copiado!';btn.classList.add('copied');
    setTimeout(()=>{btn.textContent=was;btn.classList.remove('copied');},2500);
  }).catch(()=>{
    const t=document.createElement('textarea');t.value=out;document.body.appendChild(t);t.select();
    try{document.execCommand('copy');}catch(e){}document.body.removeChild(t);
    const was=btn.textContent;btn.textContent='✓ Copiado!';setTimeout(()=>btn.textContent=was,2000);
  });
}
