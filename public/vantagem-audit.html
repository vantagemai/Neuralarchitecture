<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vantagem.ai — Auditoria Final: Estrutura Definitiva</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
@import url('https://fonts.googleapis.com/css2?family=family=Barlow+Condensed:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Barlow+Condensed:wght@400;500;600;700&display=swap');

/* ============================================================
   VANTAGEM.ai — Design System
   Brand: vermelho var(--red) + branco #F5F5F5 + preto #060606
   Red = identidade da marca | Gold = dados financeiros positivos
   ============================================================ */
:root {
  /* ── TERMINAL PALETTE ── */
  --bg:    #070707;
  --bg2:   #0b0b0b;
  --bg3:   #101010;
  --bg4:   #161616;
  --bd:    #1a1a1a;
  --bd2:   #262626;
  --bd3:   #333333;
  --txt:   #c0c0c0;
  --dim:   #585858;
  --off:   #303030;
  /* status */
  --red:   #ea2525;
  --brand: #ea2525;
  --grn:   #2d6e38;
  --war:   #7a6300;
  --gold:  #7a6300;
  --warn:  #7a6300;
  /* legacy aliases — clamped to palette */
  --wh:    #c0c0c0;
  --gy2:   #585858;
  --gy:    #383838;
  --purp:  #585858;
  --blu:   #585858;
  /* ── ZERO RADIUS ── */
  --r1:    0px;
  --r2:    0px;
  --r3:    0px;
  /* ── TYPOGRAPHY ── */
  --font:  'DM Mono', 'Courier New', 'Lucida Console', monospace;
  --m:     'DM Mono', 'Courier New', monospace;
  --b:     'DM Mono', 'Courier New', monospace;
  --h:     'DM Mono', 'Courier New', monospace;
  /* ── LAYOUT ── */
  --sidebar-w: 160px;
  --chat-w: 280px;
  --rp-w:  300px;
  /* ── SPACING (increased for usability) ── */
  --s1:    8px;
  --s2:    16px;
  --s3:    20px;
  --s4:    28px;
  /* ── TRANSITIONS (minimal) ── */
  --ease: color .1s, background .1s, border-color .1s;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 15px; -webkit-font-smoothing: antialiased; }

body {
  background: var(--bg);
  color: var(--wh);
  font-family: var(--b);
  font-size: 14px;
  font-weight: 400;
  line-height: 1.6;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ============================================================
   LAYOUT
   ============================================================ */
.app-shell { display: flex; flex: 1; min-height: 0; }
.main-content {
  margin-left: var(--sidebar-w);
  flex: 1;
  min-width: 0;
  overflow-y: auto;
  height: calc(100vh - 52px);
  scroll-behavior: smooth;
}

/* ============================================================
   HEADER
   ============================================================ */
.header {
  background: rgba(6,6,6,.97);
  border-bottom: 1px solid var(--bd);
  padding: 0 28px 0 calc(var(--sidebar-w) + 28px);
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: nowrap;
  gap: 16px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.header-title {
  font-family: var(--b);
  font-size: 13px;
  font-weight: 600;
  color: var(--gy2);
  letter-spacing: .08em;
  text-transform: uppercase;
}
.header-title span { color: var(--brand); }
.header-meta {
  font-family: var(--m);
  font-size: 11px;
  color: var(--gy);
  letter-spacing: .06em;
}

/* ============================================================
   SIDEBAR
   ============================================================ */
.sidebar {
  width: var(--sidebar-w);
  background: var(--bg2);
  border-right: 1px solid var(--bd);
  position: fixed;
  top: 52px; left: 0; bottom: 0;
  overflow-y: auto;
  z-index: 90;
  scrollbar-width: none;
  display: flex;
  flex-direction: column;
}
.sidebar::-webkit-scrollbar { display: none; }

/* Logo area */
.sidebar-logo {
  padding: 20px 20px 16px;
  border-bottom: 1px solid var(--bd);
}

/* Dashboard button — brand red */
.sn-special {
  display: block;
  margin: 12px 10px 4px;
  padding: 10px 14px;
  border-radius: var(--r2);
  background: var(--brand);
  color: #fff;
  font-family: var(--b);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  text-align: left;
  border: none;
  width: calc(100% - 20px);
  transition: var(--ease);
  letter-spacing: .04em;
  text-transform: uppercase;
}
.sn-special:hover { background: #c00; }

/* Section labels */
.sidebar-section {
  padding: 16px 16px 4px;
  font-family: var(--m);
  font-size: 9px;
  color: var(--gy);
  text-transform: uppercase;
  letter-spacing: .18em;
}

/* Nav items */
.sn {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 14px;
  margin: 1px 6px;
  border-radius: var(--r1);
  font-family: var(--b);
  font-size: 13px;
  font-weight: 500;
  color: var(--gy2);
  cursor: pointer;
  border: none;
  background: none;
  text-align: left;
  width: calc(100% - 12px);
  transition: var(--ease);
  white-space: nowrap;
  letter-spacing: .02em;
}
.sn:hover { background: var(--bg3); color: var(--wh); }
.sn.act {
  background: rgba(224,16,16,.1);
  color: var(--brand);
  font-weight: 600;
}
.sn.act .sn-dot { background: var(--brand); }
.sn-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--gy);
  flex-shrink: 0;
  transition: var(--ease);
}

.sidebar-bottom {
  margin-top: auto;
  padding: 14px 16px;
  border-top: 1px solid var(--bd);
}

/* ============================================================
   CONTENT PANELS
   ============================================================ */
.tab-panel {
  display: none;
  padding: var(--s4) var(--s4) 80px;
  max-width: 1120px;
  margin: 0 auto;
}
.tab-panel > :first-child { scroll-margin-top: 68px; }
.tab-panel.act { display: block; }

@keyframes fadeInPanel {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ============================================================
   TIPOGRAFIA
   ============================================================ */
h2 {
  font-family: var(--h);
  font-size: clamp(22px, 2.5vw, 32px);
  letter-spacing: .03em;
  color: var(--wh);
  margin-bottom: var(--s2);
  line-height: 1.1;
  font-weight: 400;
}
h3 {
  font-family: var(--b);
  font-size: 15px;
  font-weight: 600;
  letter-spacing: .01em;
  color: var(--wh);
  margin: 28px 0 14px;
  line-height: 1.3;
}
h4 {
  font-family: var(--b);
  font-size: 13px;
  font-weight: 600;
  color: var(--wh);
  margin-bottom: var(--s1);
  letter-spacing: .02em;
}
p {
  font-size: 14px;
  color: var(--gy2);
  line-height: 1.75;
  margin-bottom: var(--s2);
}
.eyebrow {
  font-family: var(--m);
  font-size: 9px;
  color: var(--brand);
  text-transform: uppercase;
  letter-spacing: .12em;
  margin-bottom: var(--s1);
}
.eyebrow.grn  { color: var(--grn); }
.eyebrow.gold { color: var(--gold); }

.score-box { text-align:center; padding:18px 12px; background:var(--bg2); border:1px solid var(--bd); }
.score-n { font-family:var(--h); font-size:clamp(32px,4vw,56px); line-height:1; margin-bottom:6px; }
.score-l { font-size:12px; color:var(--gy2); line-height:1.5; }
.g5 { display:grid; grid-template-columns:repeat(5,1fr); gap:12px; }
.role-card { background:var(--bg2); border:1px solid var(--bd); padding:var(--s3); }
.role-label { font-family:var(--m); font-size:11px; letter-spacing:.12em; margin-bottom:6px; }
.role-entry { font-family:var(--h); font-size:clamp(28px,4vw,48px); line-height:1; margin-bottom:4px; }
.stat-card { background:var(--bg2); border:1px solid var(--bd); padding:12px; text-align:center; }
.stat-label { font-family:var(--m); font-size:9px; color:var(--dim); text-transform:uppercase; letter-spacing:.08em; margin-bottom:4px; }
.stat-value { font-family:var(--h); font-size:24px; line-height:1; color:var(--wh); }
.input-ctrl { background:var(--bg3)!important; border:1px solid var(--bd)!important; padding:6px 10px!important; color:var(--wh)!important; font-family:var(--m)!important; font-size:12px!important; }
